  };
  const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 16 16" aria-hidden="true">${P[n]}</svg>`;
  const SRC_ICON = { gmail: 'mail', granola: 'note', slack: 'hash', sheet: 'sheet', manual: 'user' };
  const SRC_NAME = { gmail: 'Gmail', granola: 'Granola', slack: 'Slack', sheet: 'Sheet', manual: 'Added' };

  // ── Persistence ────────────────────────────────────────────────────────
  // Shared edits (dates, decisions, TL;DRs, rules, visibility) go to Supabase on the live page and stay
  // in this browser for local files. Display preferences (view, zoom, open rows, theme) are always per browser.
  const SHARED = ['overrides', 'decisions', 'catEdits', 'actEdits', 'added', 'rules', 'visEdits', 'tldr'];
  const KEY = OWNER ? 'atlas-hq:' : 'atlas-hq-team:';
  const local = {
    get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  const store = {
    get: (k, d) => (LIVE && SHARED.includes(k) ? LIVE.get(k, d) : local.get(k, d)),
    set(k, v) {
      if (!LIVE || !SHARED.includes(k)) return local.set(k, v);
      if (!OWNER) return;
      LIVE.set(k, v);
      publishTeamSoon();
    }
  };

  let CH, SEC, BASE, BYID, WEEKS;
  function bind(data, act) {
    DATA = data; ACT = act;
    CH = Object.fromEntries(DATA.channels.map(c => [c.id, c]));
    SEC = Object.fromEntries(DATA.sections.map(s => [s.id, s]));
    BASE = DATA.items;
    BYID = Object.fromEntries(BASE.map(i => [i.id, i]));
    WEEKS = Object.fromEntries(DATA.weeks.map(w => [dn(w.start), w.theme]));
  }
  bind(DATA, ACT);
  const themeFor = k => WEEKS[mondayOf(k)] || '';

  const S = {
    view: store.get('view', 'activity'),
    tldr: store.get('tldr', {}),
    editingTldr: null,
    overrides: store.get('overrides', {}),
    rules: { ...DATA.rules, ...store.get('rules', {}) },
    decisions: store.get('decisions', {}),
    catEdits: store.get('catEdits', {}),
    actEdits: store.get('actEdits', {}),
    added: store.get('added', []),
    collapsed: store.get('collapsed', {}),
    zoom: store.get('zoom', 'day'),
    hideLive: store.get('hideLive', true),
    q: '',
    ch: new Set(),
    focus: null,
    actFilter: 'open',
    openCh: store.get('openCh', {}),
    openItems: new Set(),
    showDone: {},
    flash: null,
    visEdits: store.get('visEdits', {}),
    preview: false,
    cal: {
      sel: TODAY,
      mode: store.get('calMode', 'month'),
      month: (() => { const d = ud(TODAY); return dn(`${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-01`); })(),
      week: mondayOf(TODAY),
      types: new Set(store.get('calTypes', ['post', 'fin', 'cap', 'brief', 'ms', 'event']))
    },
    sel: null,
    ripple: null,
    addingIn: null
  };
  const save = k => store.set(k, S[k]);
  const PRIV = () => OWNER && !S.preview;   // show sources, private cards and the queue
  const CAN_EDIT = () => OWNER && !S.preview;

  // ── Activity: seed + Zoe's decisions ───────────────────────────────────
  function activity() {
    const seen = new Set();
    const out = [];
    const push = (a, origin) => {
      if (seen.has(a.id)) return; seen.add(a.id);
      const e = S.actEdits[a.id] || {};
      if (e.removed) return;
      const decision = origin === 'queue' ? S.decisions[a.id] || 'pending' : 'approved';
      const item = { ...a, ...e, cat: S.catEdits[a.id] || e.cat || a.cat, vis: S.visEdits[a.id] || a.vis || 'team', origin, state: decision };
      if (decision === 'completed') item.status = 'done';
      out.push(item);
    };
    (ACT.items || []).forEach(a => push(a, 'seed'));
    (ACT.queue || []).forEach(a => push(a, 'queue'));
    S.added.forEach(a => push(a, 'manual'));
    return PRIV() ? out : out.filter(a => (a.state === 'approved' || a.state === 'completed') && a.vis === 'team');
  }
  const STATUS_ORDER = { blocked: 0, waiting: 1, in_progress: 2, todo: 3, done: 4 };
  const STATUS_LABEL = { blocked: 'Blocked', waiting: 'Waiting', in_progress: 'In progress', todo: 'To do', done: 'Done' };
  const STATUS_ICON = { blocked: 'alert', waiting: 'clock', in_progress: 'dot', todo: 'hold', done: 'check' };

  // ── Rules engine ───────────────────────────────────────────────────────
  let R = {};
  let ACTS = [];
  const FLAG_ORDER = ['missed', 'cant', 'act', 'slip', 'late', 'cap', 'brief', 'fit', 'buffer'];

  function resolveItem(it) {
    const o = S.overrides[it.id] || {};
    const r = { ...it, ...o, edited: Object.keys(o).length > 0 };
    if (it.feeds) {
      const p = { ...BYID[it.feeds], ...(S.overrides[it.feeds] || {}) };
      if (p.fin && !o.fin) r.fin = ds(dn(p.fin) - 1);
      r.work = r.work || S.rules.workDays;
    }
    return r;
  }

  function assess(r, links) {
    const RL = S.rules;
    const F = [];
    const red = (t, code, sh) => F.push({ lv: 'red', t, code, s: sh || t });
    const amb = (t, code, sh) => F.push({ lv: 'amber', t, code, s: sh || t });
    const k = {
      brief: dn(r.brief), cap: dn(r.cap), fin: dn(r.fin), post: dn(r.post),
      pPost: dn(r.plan && r.plan.post), pFin: dn(r.plan && r.plan.fin), pBrief: dn(r.plan && r.plan.brief)
    };
    const tbc = new Set(r.tbc || []);
    const live = r.status === 'live';
    const ready = r.status === 'done';
    const wd = r.work || RL.workDays;
    const g = { wd };
    let state = null;

    if (r.kind === 'event') {
      g.evS = dn(r.ev.s); g.evE = dn(r.ev.e);
      state = live || g.evE < TODAY ? 'live' : 'event';
    } else if (r.kind === 'project') {
      g.segs = (r.segs || []).map(s => ({ ...s, s: dn(s.s), e: dn(s.e), ps: s.plan ? dn(s.plan.s) : null, pe: s.plan ? dn(s.plan.e) : null }));
      g.ms = (r.ms || []).map(m => ({ ...m, d: dn(m.d) }));
      g.end = Math.max(...g.segs.map(s => s.e));
      for (const sg of g.segs) {
        if (sg.ps == null || sg.e < TODAY) continue;
        const was = sg.pe - sg.ps, now = sg.e - sg.s;
        if (was === now && sg.s !== sg.ps) amb(`${sg.label} moved from ${f(sg.ps)} to ${f(sg.s)}`, 'segmove', `${sg.who} ${sg.s === sg.e ? 'handoff' : 'phase'} ${sg.s > sg.ps ? '+' : '−'}${plural(Math.abs(sg.s - sg.ps), 'day')}`);
        else if (now < was) amb(`${sg.label}: ${plural(now + 1, 'day')} now (${f(sg.s)} – ${f(sg.e)}), down from ${was + 1}`, 'segshrink', `${sg.who}: ${plural(now + 1, 'day')} to design, was ${was + 1}`);
      }
      state = r.status === 'live' ? 'live' : g.end < TODAY ? 'ready' : null;
    } else {
      if (k.brief != null) g.brief = k.brief;
      if (k.cap != null) g.cap = k.cap;
      if (k.fin != null) {
        g.fin = k.fin;
        g.revS = k.fin - RL.reviewDays;
        g.workS = k.cap != null ? k.cap + 1 : g.revS - wd;
      }
      if (k.post != null) g.post = k.post;
      if (k.pPost != null && k.post != null && k.pPost !== k.post) g.ghost = k.pPost;
      if (k.pBrief != null && k.brief == null) g.briefDue = k.pBrief;
      if (r.ms) g.ms = r.ms.map(m => ({ ...m, d: dn(m.d) }));
      g.earliestFin = k.cap != null ? k.cap + 1 + wd + RL.reviewDays : null;
      const base = Math.max(k.fin ?? -1e9, g.earliestFin ?? -1e9);
      g.earliestPost = base > -1e8 ? base + RL.clearDays + 1 : null;
    }

    if (!live && r.kind !== 'event') {
      if (k.post != null && k.post < TODAY) red(ready ? `The asset is ready, but its ${f(k.post)} post date has passed and it isn't marked live` : `Missed its ${f(k.post)} post date`, 'missed', ready ? `Ready, not posted · ${plural(TODAY - k.post, 'day')} late` : `Missed post · ${plural(TODAY - k.post, 'day')} late`);
      if (k.post != null && k.fin != null && !ready && k.post >= TODAY) {
        if (k.post <= k.fin) red(`Can't post ${f(k.post)}: the final asset isn't due until ${f(k.fin)}`, 'cant', `Can't post: final due ${f(k.fin)}`);
        else if (k.post - k.fin - 1 < RL.clearDays) red(`No clear day between the final asset (${f(k.fin)}) and the post (${f(k.post)})`, 'buffer', 'No clear day before post');
      }
      if (k.pPost != null && k.post != null && k.post > k.pPost) red(`Slipped ${plural(k.post - k.pPost, 'day')}: planned ${f(k.pPost)}, now ${f(k.post)}`, 'slip', `Slipped ${plural(k.post - k.pPost, 'day')}`);
      if (k.pFin != null && k.fin != null && k.fin > k.pFin) amb(`Final asset moved from ${f(k.pFin)} to ${f(k.fin)}`, 'finmove', `Final moved +${plural(k.fin - k.pFin, 'day')}`);
      if (k.post === TODAY) amb('Posts today. Mark it live once it\'s out.', 'today', 'Posts today');
      if (!ready && k.fin != null && k.fin < TODAY && !(k.post != null && k.post < TODAY)) {
        if (r.status === 'not_started') red(`The final asset was due ${f(k.fin)} and work hasn't started`, 'late', `Final ${plural(TODAY - k.fin, 'day')} late, not started`);
        else amb(`Confirm the final asset landed (it was due ${f(k.fin)})`, 'confirm', 'Confirm final landed');
      }
      if (k.cap != null && k.cap < TODAY && r.status === 'not_started') red(`The ${f(k.cap)} capture / receive date passed and it hasn't started`, 'cap', `Overdue ${plural(TODAY - k.cap, 'day')}${r.who ? ` · ${r.who}` : ''}`);
      if (k.cap != null && !ready && k.cap >= TODAY && k.brief == null) {
        const d = k.cap - TODAY;
        const say = k.pBrief != null ? `The brief was due ${f(k.pBrief)} and hasn't gone out. Capture is ${rel(k.cap)}` : `No brief sent yet. Capture is ${rel(k.cap)}`;
        const sh = k.pBrief != null ? `Brief ${plural(TODAY - k.pBrief, 'day')} late · capture ${f(k.cap)}` : `No brief · capture ${f(k.cap)}`;
        if (d <= 7) red(say, 'brief', sh); else if (d <= RL.briefWarnDays || k.pBrief != null) amb(say, 'brief', sh);
      }
      if (k.cap != null && k.fin != null && !ready && g.earliestFin > k.fin) red(`Not enough time: capture ${f(k.cap)} + ${plural(wd, 'work day')} + 48h review puts the final asset at ${f(g.earliestFin)} at the earliest (due ${f(k.fin)})`, 'fit', 'Not enough production time');
      if (tbc.has('post') && k.post != null) amb(`The ${f(k.post)} post date is still TBC`, 'tbc', 'Post date TBC');
      if (tbc.has('cap')) amb(`The capture date${k.cap != null ? ` (${f(k.cap)})` : ''} is TBC`, 'tbc', 'Capture TBC');
      if (tbc.has('segs')) amb('The dates are TBC', 'tbc', 'Dates TBC');
      if (k.fin != null && k.post == null && !r.feeds && r.kind !== 'project') amb('There\'s no post date yet', 'nopost', 'No post date');
      if (r.status === 'hold') amb(`On hold${r.waitingOn ? `, waiting on ${r.waitingOn}` : ''}`, 'hold', `On hold${r.waitingOn ? ` · ${r.waitingOn}` : ''}`);
      if (r.vendorTbc) amb('The data-vis vendor isn\'t confirmed (Itch is being replaced)', 'vendor', 'Data-vis vendor TBC');
      if (r.blocks && BYID[r.blocks] && !k.fin && !k.post) amb(`No date yet, and it gates ${BYID[r.blocks].t} (${f(dn((S.overrides[r.blocks] || {}).post || BYID[r.blocks].post))})`, 'gate', `Needs a date · gates ${BYID[r.blocks].t}`);
      for (const a of links) {
        const who = String(a.wait || a.owner || '').split(/[·(/]/)[0].trim();
        const n0 = F.length;
        if (a.status === 'blocked') red(`Blocked: ${a.title}`, 'act', `Blocked${who ? ` · ${who}` : ''}`);
        else if (a.status === 'waiting') amb(`Waiting on ${a.wait || a.owner}: ${a.title}`, 'act', `Waiting on ${who}`);
        if (F.length > n0 && a.vis === 'private') F[F.length - 1].priv = true;
      }
    }

    F.sort((a, b) => (a.lv === b.lv ? 0 : a.lv === 'red' ? -1 : 1) || (FLAG_ORDER.indexOf(a.code) + 99) % 99 - (FLAG_ORDER.indexOf(b.code) + 99) % 99);
    const hasRed = F.some(x => x.lv === 'red');
    const hasAmb = F.some(x => x.lv === 'amber');
    if (live) state = 'live';
    else if (hasRed) state = 'red';
    else if (hasAmb) state = 'amber';
    else if (!state) state = ready ? 'ready' : (k.fin == null && k.post == null && k.cap == null && r.kind !== 'project' ? 'none' : 'ok');
    return { state, flags: F, g, k };
  }

  function compute() {
    ACTS = activity();
    const linkMap = {};
    ACTS.filter(a => a.state === 'approved' && a.status !== 'done').forEach(a => (a.links || []).forEach(id => (linkMap[id] = linkMap[id] || []).push(a)));
    R = {};
    for (const it of BASE) R[it.id] = resolveItem(it);
    for (const it of BASE) R[it.id].a = assess(R[it.id], linkMap[it.id] || []);
  }

  // ── Filtering ──────────────────────────────────────────────────────────
  const matchesQ = r => {
    if (!S.q) return true;
    const hay = [r.t, r.who, r.vendor, r.notes, SEC[r.sec] && SEC[r.sec].name, r.sub, CH[r.ch] && CH[r.ch].name].join(' ').toLowerCase();
    return S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  };
  const matchesFocus = r => {
    if (!S.focus) return true;
    if (S.focus === 'red') return r.a.state === 'red';
    if (S.focus === 'amber') return r.a.state === 'amber';
    if (S.focus === 'waiting') return r.a.flags.some(x => x.code === 'act' || x.code === 'hold');
    return true;
  };
  const visible = r => matchesQ(r) && matchesFocus(r) && (!S.ch.size || S.ch.has(r.ch)) && !(S.hideLive && r.a.state === 'live');

  // ── Shared UI bits ─────────────────────────────────────────────────────
  const stIcon = s => s === 'red' ? `<span class="st red" title="Can't post / slipped">${ic('alert')}</span>`
    : s === 'amber' ? `<span class="st amber" title="At risk">${ic('alert')}</span>`
    : s === 'ready' ? `<span class="st ready" title="Asset ready">${ic('check')}</span>`
    : s === 'live' ? `<span class="st live" title="Live / done">${ic('check')}</span>`
    : s === 'event' ? '<span class="st event" title="Event"></span>'
    : s === 'none' ? '<span class="st none" title="Not scheduled"></span>'
    : '<span class="st ok" title="On track"></span>';
  const STATE_WORD = { red: 'Can\'t post / slipped', amber: 'At risk', ok: 'On track', ready: 'Asset ready', live: 'Live', none: 'Not scheduled', event: 'Event' };
  const chanChips = () => `<div class="chans ${S.ch.size ? 'some' : ''}" role="group" aria-label="Channels">${DATA.channels.map(c => `<button class="cchip" data-ch="${c.id}" data-chf="${c.id}" aria-pressed="${S.ch.has(c.id)}"><span class="sw"></span>${esc(c.name)}</button>`).join('')}</div>`;
  const searchBox = id => `<label class="search">${ic('search')}<span class="sr">Search</span><input id="${id}" type="search" placeholder="Search" value="${esc(S.q)}" autocomplete="off"><kbd>/</kbd></label>`;

  // ── Top bar + pulse ────────────────────────────────────────────────────
  function renderChrome() {
    const pending = ACTS.filter(a => a.state === 'pending').length;
    $('#tab-timeline').innerHTML = `${ic('gantt')}<span class="tab-long">Content Production Timeline</span><span class="tab-short">Production</span>`;
    $('#tab-calendar').innerHTML = `${ic('calendar')}Calendar`;
    $('#tab-activity').innerHTML = `${ic('grid')}Activity${pending && PRIV() ? `<span class="count" aria-label="${pending} to review">${pending}</span>` : ''}`;
    $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === S.view)));
    const last = (ACT.scans || []).map(s => new Date(s.at)).sort((a, b) => b - a)[0];
    $('#sync').innerHTML = PRIV() && last
      ? `<span class="dot"></span><span class="txt">Scanned ${MON[last.getMonth()]} ${last.getDate()}, ${last.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>`
      : `<span class="dot"></span><span class="txt">Updated ${f(dn(ACT.updated || DATA.snapshot))}</span>`;
    $('#btn-rules').innerHTML = `${ic('sliders')}<span>Rules</span>`;
    $('#btn-rules').hidden = !OWNER;
    $('#owner-tools').innerHTML = OWNER ? `
      <div class="whois" role="group" aria-label="View as">
        <button data-viewas="me" aria-pressed="${!S.preview}" title="Private view: sources, private cards and the queue">${ic('lock')}<span>Private</span></button>
        <button data-viewas="team" aria-pressed="${S.preview}" title="Preview exactly what Team view shows">${ic('users')}<span>Team</span></button>
      </div>
      ${LIVE ? '' : `<button class="icon-btn" data-share-team title="Download the team file: no sources, no private cards">${ic('share')}<span>Share</span></button>`}` : '';
    if (LIVE) {
      const me = LIVE.me;
      $('#live-tools').innerHTML = `${me.role === 'admin' ? `<button class="icon-btn" data-admin aria-haspopup="dialog" title="Settings: users and access">${ic('gear')}<span>Settings</span></button>` : ''}
        <button class="avatar" data-account aria-haspopup="dialog" title="Signed in as ${esc(me.email)}">${esc((me.name || me.email).trim().charAt(0).toUpperCase())}</button>`;
    }
    const pb = $('#preview-bar');
    pb.hidden = !S.preview;
    pb.innerHTML = !S.preview ? '' : LIVE
      ? `${ic('users')}<span><b>Team view.</b> This is exactly what people with Team view see. Sources, private cards and Claude's queue never reach them.</span><button class="btn" data-viewas="me">${ic('lock')}Back to Private view</button>`
      : `${ic('users')}<span><b>Team view.</b> This is exactly what the team sees. Sources, private cards and Claude's queue are not in their file.</span><button class="btn" data-viewas="me">${ic('lock')}Back to Private view</button><button class="btn primary" data-share-team>${ic('share')}Download team file</button>`;
    document.body.classList.toggle('previewing', S.preview);
    document.body.classList.toggle('team-file', !OWNER);
    const th = document.documentElement.getAttribute('data-theme') || 'dark';
    $('[data-theme-set="dark"]').innerHTML = ic('moon');
    $('[data-theme-set="light"]').innerHTML = ic('sun');
    $$('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === th)));
  }

  function renderPulse() {
    const items = Object.values(R);
    const red = items.filter(r => r.a.state === 'red').length;
    const amber = items.filter(r => r.a.state === 'amber').length;
    const waiting = ACTS.filter(a => a.state === 'approved' && (a.status === 'waiting' || a.status === 'blocked')).length;
    const upcoming = items.filter(r => r.a.g.post != null && r.a.g.post >= TODAY && r.a.state !== 'live').sort((a, b) => a.a.g.post - b.a.g.post);
    const nxt = upcoming[0];
    const wk = mondayOf(TODAY);
    $('#pulse').innerHTML = `
      <div class="when"><span class="day">${fw(TODAY)}</span><span class="theme">${esc(themeFor(TODAY) || `Week of ${f(wk)}`)}</span></div>
      <span class="sep"></span>
      <button class="chip red" data-focus="red" aria-pressed="${S.focus === 'red'}"><span class="pip"></span><b>${red}</b> can't post or slipped</button>
      <button class="chip amber" data-focus="amber" aria-pressed="${S.focus === 'amber'}"><span class="pip"></span><b>${amber}</b> at risk</button>
      <button class="chip wait" data-focus="waiting" aria-pressed="${S.focus === 'waiting'}"><span class="pip"></span><b>${waiting}</b> waiting on people</button>
      ${nxt ? `<div class="next"><span class="orb"></span><span class="lbl">Next post</span><span>${fw(nxt.a.g.post)} · <a data-open="${nxt.id}">${esc(nxt.t)}</a>${nxt.a.state === 'red' ? ` <span style="color:var(--red-ink)">(can't make it)</span>` : ''}</span></div>` : ''}`;
  }

  // ── Timeline (Gantt) ───────────────────────────────────────────────────
  let RANGE = null;
  function range() {
    const ks = [];
    Object.values(R).forEach(r => { const g = r.a.g; [g.brief, g.cap, g.fin, g.post, g.ghost, g.evE, g.end, g.workS].forEach(v => v != null && ks.push(v)); });
    const start = mondayOf(Math.min(dn('2026-09-28'), ...ks));
    const end = mondayOf(Math.max(...ks, TODAY + 42) + 7) + 6;
    return { start, end };
  }

  function renderTimelineToolbar() {
    $('#tb-timeline').innerHTML = `
      <h1>Content Production Timeline</h1>
      ${searchBox('q-timeline')}
      ${chanChips()}
      <span class="grow"></span>
      <div class="seg" role="group" aria-label="Zoom"><button data-zoom="day" aria-pressed="${S.zoom === 'day'}">Days</button><button data-zoom="week" aria-pressed="${S.zoom === 'week'}">Weeks</button></div>
      <button class="icon-btn" data-hide-live aria-pressed="${S.hideLive}">${ic('eye')}${S.hideLive ? 'Show live' : 'Hide live'}</button>
      <button class="icon-btn" data-today>${ic('dot')}Today</button>`;
  }

  function tipAttr(k, v, cls = '') { return ` data-tip="${esc(k)}" data-tv="${esc(v)}"${cls ? ` data-tc="${cls}"` : ''}`; }

  function renderGantt(keepScroll = true) {
    const el = $('#gantt');
    const prev = keepScroll ? { l: el.scrollLeft, t: el.scrollTop } : null;
    RANGE = range();
    const { start, end } = RANGE;
    const dw = S.zoom === 'day' ? 34 : 13;
    const days = end - start + 1;
    const W = days * dw;
    const x = k => (k - start) * dw;
    const cx = k => x(k) + dw / 2;
    const wrap = $('#gantt-wrap');
    wrap.style.setProperty('--dw', dw + 'px');
    wrap.style.setProperty('--lw', '340px');
    wrap.classList.toggle('zoom-week', S.zoom === 'week');

    let weeks = '', dayCells = '';
    for (let w = start; w <= end; w += 7) {
      const th = themeFor(w);
      const label = S.zoom === 'day' ? `${f(w).toUpperCase()} – ${f(w + 6).toUpperCase()}` : f(w).toUpperCase();
      weeks += `<div class="g-week ${w === mondayOf(TODAY) ? 'now' : ''}" style="width:${7 * dw}px"><div class="wk-in"><div class="wd">${label}</div><div class="wt ${th ? '' : 'none'}">${th ? esc(th) : (S.zoom === 'day' ? 'No theme set' : '')}</div></div></div>`;
    }
    for (let k = start; k <= end; k++) {
      const d = dow(k);
      dayCells += `<div class="g-day ${d >= 5 ? 'we' : ''} ${d === 0 ? 'mon' : ''} ${k === TODAY ? 'today' : ''}" style="width:${dw}px"><span class="dl">${WD[d][0]}</span><span class="dn">${ud(k).getUTCDate()}</span></div>`;
    }

    const visibleIds = new Set(Object.values(R).filter(visible).map(r => r.id));
    const filtering = S.q || S.ch.size || S.focus || S.hideLive;
    let rows = '';
    let shown = 0;
    for (const sec of DATA.sections) {
      const all = BASE.filter(i => i.sec === sec.id).map(i => R[i.id]);
      const vis = all.filter(r => visibleIds.has(r.id));
      if (!vis.length) continue;
      const collapsed = S.collapsed[sec.id] && !filtering;
      const nRed = vis.filter(r => r.a.state === 'red').length, nAmb = vis.filter(r => r.a.state === 'amber').length;
      const dots = vis.filter(r => r.a.g.post != null).map(r => `<span class="sd ${r.a.state === 'red' ? 'red' : r.a.state === 'amber' ? 'amber' : r.a.state === 'live' ? 'live' : ''}" style="left:${cx(r.a.g.post)}px"></span>`).join('');
      rows += `<div class="g-row sec ${collapsed ? 'collapsed' : ''}">
        <div class="g-label" role="button" tabindex="0" data-sec="${sec.id}" aria-expanded="${!collapsed}">
          <span class="chev">${ic('chevD')}</span><span class="stitle">${esc(sec.name)}</span>
          <span class="tally">${nRed || nAmb ? `${nRed ? `<span class="t-red">${nRed} red</span>` : ''}${nRed && nAmb ? ' · ' : ''}${nAmb ? `<span class="t-amber">${nAmb} at risk</span>` : ''}` : plural(vis.length, 'item')}</span>
        </div>
        <div class="g-track sec-dots" style="width:${W}px">${collapsed ? dots : ''}</div>
      </div>`;
      if (collapsed) continue;
      const subOrder = [...new Set(all.map(r => r.sub || ''))];
      vis.sort((a, b) => subOrder.indexOf(a.sub || '') - subOrder.indexOf(b.sub || ''));
      let lastSub = null;
      for (const r of vis) {
        if (r.sub && r.sub !== lastSub) {
          rows += `<div class="g-row sub"><div class="g-label"><span class="lbl">${esc(r.sub)}</span></div><div class="g-track" style="width:${W}px"></div></div>`;
          lastSub = r.sub;
        }
        rows += rowHtml(r, { x, cx, dw, W });
        shown++;
      }
    }
    if (!shown) {
      rows = `<div class="g-empty"><div class="disp">Nothing matches</div>Try a different search, or clear the channel and attention filters.<div style="margin-top:14px"><button class="icon-btn" data-clear-filters>${ic('reset')}Clear filters</button></div></div>`;
    }

    el.innerHTML = `<div class="g-inner" style="width:calc(var(--lw) + ${W}px)">
      <div class="g-head">
        <div class="g-corner"><div class="row"><span class="lbl">Deliverable</span><span class="lbl">Post</span></div>
          <div class="row"><button data-collapse-all>${Object.values(S.collapsed).some(Boolean) ? 'Expand all' : 'Collapse all'}</button><span class="lbl" style="color:var(--ink-4)">${shown} shown</span></div></div>
        <div class="g-ruler" style="width:${W}px"><div class="g-weeks">${weeks}</div><div class="g-days">${dayCells}</div></div>
      </div>
      <div class="g-body">
        <div class="g-grid"></div>
        ${TODAY >= start && TODAY <= end ? `<div class="g-todaycol" style="left:calc(var(--lw) + ${x(TODAY)}px);width:${dw}px"></div><div class="g-today" style="left:calc(var(--lw) + ${cx(TODAY)}px)"></div>` : ''}
        ${rows}
      </div>
    </div>`;
    if (prev) { el.scrollLeft = prev.l; el.scrollTop = prev.t; }
  }

  function rowHtml(r, { x, cx, dw, W }) {
    const { state, g, k } = r.a;
    let m = '';
    const meta = [r.tag, r.who, r.vendor].filter(Boolean).join(' · ');
    const isContent = !r.kind || r.kind === 'launch';
    if (r.kind === 'event') {
      const w = (g.evE - g.evS + 1) * dw;
      m += `<div class="mk m-event" data-ch="${r.ch}" style="left:${x(g.evS) + 1}px;width:${w - 2}px"${tipAttr(r.t, g.evS === g.evE ? fw(g.evS) : `${fw(g.evS)} – ${fw(g.evE)}`)}>${w > 58 ? (g.evS === g.evE ? f(g.evS) : (w > 96 ? `Runs ${f(g.evS)}–${ud(g.evE).getUTCDate()}` : `${f(g.evS)}–${ud(g.evE).getUTCDate()}`)) : ''}</div>`;
    } else if (r.kind === 'project') {
      for (const s of [...g.segs].sort((a, b) => (a.who === 'Atlas') - (b.who === 'Atlas'))) {
        const cls = s.qa ? 'qa' : s.who === 'Atlas' ? 'atlas' : 'vendor';
        const moved = s.ps != null && s.pe - s.ps === s.e - s.s && s.ps !== s.s;
        if (moved) {
          const d = s.s - s.ps;
          const gv = `;--ghost:${d > 0 ? (state === 'red' ? 'var(--red)' : 'var(--amber)') : 'var(--ink-3)'}`;
          const a = Math.min(cx(s.ps), cx(s.s)), b = Math.max(cx(s.ps), cx(s.s));
          m += `<div class="mk m-seg ghost" style="left:${x(s.ps) + 1}px;width:${(s.pe - s.ps + 1) * dw - 2}px${gv}"${tipAttr(`Was: ${s.who} · ${s.label}`, fw(s.ps))}></div>`;
          m += `<div class="mk m-drift ${d < 0 ? 'back' : ''}" style="left:${a + dw / 2}px;width:${b - a - dw}px${gv}"><span class="dl">${d > 0 ? '+' : '−'}${Math.abs(d)}D</span></div>`;
        }
        m += `<div class="mk m-seg ${cls} ${(r.tbc || []).includes('segs') ? 'tbc' : ''}" style="left:${x(s.s) + 1}px;width:${(s.e - s.s + 1) * dw - 2}px"${tipAttr(`${s.who}: ${s.label}`, (s.s === s.e ? fw(s.s) : `${fw(s.s)} – ${fw(s.e)}`) + (moved ? ` (was ${f(s.ps)})` : ''))}></div>`;
      }
      for (const ms of g.ms || []) {
        if (ms.kind !== 'goal' && ms.kind !== 'delivery') continue;
        m += `<div class="mk m-ms ${ms.kind}" style="left:${cx(ms.d)}px"${tipAttr(`${fw(ms.d)} · ${ms.who}`, ms.label)}></div>`;
      }
    } else {
      if (g.brief != null && g.cap != null && g.cap > g.brief) m += `<div class="mk m-talent" style="left:${cx(g.brief)}px;width:${cx(g.cap) - cx(g.brief)}px"${tipAttr('Out with talent', `${f(g.brief)} → ${f(g.cap)}`)}></div>`;
      if (g.brief != null) m += `<div class="mk m-brief" style="left:${cx(g.brief)}px"${tipAttr('Brief sent', fw(g.brief))}></div>`;
      if (g.briefDue != null) m += `<div class="mk m-brief" style="left:${cx(g.briefDue)}px;border-style:dashed;border-color:var(--red)"${tipAttr('Brief due, not sent', fw(g.briefDue), 'tr')}></div>`;
      if (g.cap != null) m += `<div class="mk m-cap" style="left:${cx(g.cap)}px"${tipAttr(r.ch === 'press' ? 'Receive' : 'Capture', fw(g.cap) + ((r.tbc || []).includes('cap') ? ' (TBC)' : ''))}></div>`;
      if (g.fin != null) {
        const ws = g.workS, rs = g.revS;
        const we = Math.min(rs, ws + g.wd);
        if (ws < rs && we < rs) m += `<div class="mk m-slack" data-drag="block" style="left:${x(we)}px;width:${x(rs) - x(we)}px"${tipAttr(`Slack · ${plural(rs - we, 'day')}`, `Room before the review starts ${fw(rs)}`)}></div>`;
        if (ws < rs) m += `<div class="mk m-work ${we < rs ? 'solo' : ''}" data-drag="block" style="left:${x(ws)}px;width:${x(we) - x(ws)}px"${tipAttr(`Work · ${plural(g.wd, 'day')} needed`, `${fw(ws)} → ${fw(we - 1)}`)}></div>`;
        m += `<div class="mk m-review ${ws >= rs || ws + g.wd < rs ? 'solo' : ''}" data-drag="block" style="left:${x(rs)}px;width:${cx(g.fin) - x(rs)}px"${tipAttr('48h review', `${fw(rs)} → ${fw(g.fin - 1)}, wraps as the final asset lands ${f(g.fin)}`)}></div>`;
        m += `<div class="mk m-final drag" data-drag="fin" style="left:${cx(g.fin)}px"${tipAttr('Final asset due', fw(g.fin) + (r.feeds ? ` · feeds ${BYID[r.feeds].t}` : ''))}></div>`;
        if (g.post != null && g.post > g.fin) {
          const clear = g.post - g.fin - 1;
          m += `<div class="mk m-clear" style="left:${cx(g.fin) + 2}px;width:${cx(g.post) - cx(g.fin) - 8}px"${tipAttr('Clear days before post', plural(clear, 'day'), clear < S.rules.clearDays ? 'tr' : '')}></div>`;
        }
        if (r.feeds) m += `<div class="mk m-feeds" style="left:${cx(g.fin) + 8}px">→ ${esc(BYID[r.feeds].t.replace('Data anecdote: ', '').replace('Advisor anecdote: ', ''))}</div>`;
      }
      if (g.ms) for (const ms of g.ms) m += `<div class="mk" style="left:${cx(ms.d) - 1.5}px;top:7px;width:3px;height:3px;border-radius:50%;background:var(--ink-3)"${tipAttr(`${fw(ms.d)} · ${ms.who}`, ms.label)}></div>`;
      if (g.ghost != null && g.post != null) {
        const a = Math.min(cx(g.ghost), cx(g.post)), b = Math.max(cx(g.ghost), cx(g.post));
        const d = g.post - g.ghost;
        const gv = d < 0 ? ';--ghost:var(--ink-3)' : '';
        m += `<div class="mk m-drift ${d < 0 ? 'back' : ''}" style="left:${a + 7}px;width:${b - a - 14}px${gv}"><span class="dl">${d > 0 ? '+' : '−'}${Math.abs(d)}D</span></div>`;
        m += `<div class="mk m-ghost" style="left:${cx(g.ghost)}px${gv}"${tipAttr(d > 0 ? 'Originally planned post' : 'Pulled forward from', fw(g.ghost))}></div>`;
      }
      if (g.post != null) m += `<div class="mk m-post drag" data-drag="post" style="left:${cx(g.post)}px"${tipAttr(r.kind === 'launch' ? 'Launch' : 'Post / live', fw(g.post) + ((r.tbc || []).includes('post') ? ' (TBC)' : ''), state === 'red' ? 'tr' : '')}></div>`;
    }
    // overdue: a passed date with nothing delivered draws a dashed line to today
    const od = r.a.flags.find(fl => ['cap', 'late', 'missed'].includes(fl.code));
    if (od) {
      const from = od.code === 'cap' ? g.cap : od.code === 'late' ? g.fin : g.post;
      if (from != null && from < TODAY) m += `<div class="mk m-overdue" style="left:${cx(from) + 7}px;width:${cx(TODAY) - cx(from) - 7}px"></div>`;
    }
    // every red or amber row writes its reason on the chart
    const top = r.a.flags[0];
    if (state === 'red' || state === 'amber' || state === 'none') {
      const ends = [g.brief, g.cap, g.fin, g.post, g.ghost, g.briefDue].filter(v => v != null).map(cx);
      if (g.evE != null) ends.push(x(g.evE + 1));
      if (g.end != null) ends.push(x(g.end + 1));
      const at = Math.max(cx(TODAY), ...ends) + 14;
      const more = r.a.flags.length - 1;
      const txt = state === 'none' ? 'Not scheduled' : top.s;
      m += `<div class="mk m-why ${state}" style="left:${at}px">${esc(txt)}${more > 0 && state !== 'none' ? `<span class="plus"> · ${more} more</span>` : ''}</div>`;
    }
    const postK = g.post ?? (r.kind === 'event' ? g.evS : null);
    const postCls = state === 'red' ? 'red' : state === 'amber' ? 'amber' : '';
    const aria = `${r.t}. ${STATE_WORD[state]}.${postK != null ? ` ${r.kind === 'event' ? 'Starts' : 'Posts'} ${fw(postK)}.` : ''}`;
    return `<div class="g-row item state-${state} ${S.sel === r.id ? 'sel' : ''} ${S.ripple === r.id ? 'ripple' : ''}" data-id="${r.id}">
      <div class="g-label" role="button" tabindex="0" aria-label="${esc(aria)}">
        ${stIcon(state)}
        <span class="it-name"><span class="nm">${esc(r.t)}</span><span class="meta"><span class="chdot" data-ch="${r.ch}"></span>${esc(CH[r.ch].name)}${meta ? ' · ' + esc(meta) : ''}${r.edited ? '<span class="ed">Edited</span>' : ''}</span></span>
        <span class="it-post ${postCls}">${postK != null ? `<span class="k">${r.kind === 'event' ? 'Starts' : r.kind === 'launch' ? 'Launch' : 'Post'}</span>${f(postK)}` : r.kind === 'project' ? `<span class="k">Ends</span>${f(g.end)}` : ''}</span>
      </div>
      <div class="g-track" style="width:${W}px">${m}</div>
    </div>`;
  }

  function renderLegend() {
    const rl = S.rules;
    $('#legend').innerHTML = `
      <span class="lg"><span class="mk m-brief"></span>Brief sent</span>
      <span class="lg"><span class="mk m-talent"></span>With talent</span>
      <span class="lg"><span class="mk m-cap"></span>Capture</span>
      <span class="lg state-ok"><span class="mk m-work"></span>Work</span>
      <span class="lg state-ok"><span class="mk m-slack"></span>Slack</span>
      <span class="lg state-ok"><span class="mk m-review"></span>48h review</span>
      <span class="lg state-ok"><span class="mk m-final"></span>Final asset due</span>
      <span class="lg state-ok"><span class="mk m-clear"></span>Clear day</span>
      <span class="lg state-ok"><span class="mk m-post"></span>Post</span>
      <span class="lg"><span class="mk m-ghost"></span>Planned date (moved)</span>
      <span class="lg">${stIcon('red')}Can't post / slipped</span>
      <span class="lg">${stIcon('amber')}At risk</span>
      <span class="rule-note">Rule: a <b>${rl.reviewDays * 24}-hour review</b> wraps as the final asset lands, then <b>${plural(rl.clearDays, 'clear day')}</b> before posting.${CAN_EDIT() ? ' Drag a post dot or a bar to see the knock-on effect.' : ''}</span>`;
  }

  function scrollGanttToToday(smooth) {
    if (!RANGE) return;
    const el = $('#gantt');
    const dw = S.zoom === 'day' ? 34 : 13;
    const lw = parseFloat(getComputedStyle($('#gantt-wrap')).getPropertyValue('--lw')) || 340;
    const lead = Math.min((S.zoom === 'day' ? 6 : 14) * dw, Math.max(0, (el.clientWidth - lw) * 0.22));
    el.scrollTo({ left: Math.max(0, (TODAY - RANGE.start) * dw - lead), behavior: smooth ? 'smooth' : 'auto' });
  }

  // ── Calendar ───────────────────────────────────────────────────────────
  const TYPES = [
    { id: 'post', name: 'Posts' }, { id: 'fin', name: 'Final assets' }, { id: 'cap', name: 'Captures' },
    { id: 'brief', name: 'Briefs' }, { id: 'ms', name: 'Milestones' }, { id: 'event', name: 'Events' }
  ];

  function calEntries() {
    const byDay = {};
    const spans = [];
    const add = (k, e) => { (byDay[k] = byDay[k] || []).push(e); };
    for (const r of Object.values(R)) {
      if (!matchesQ(r) || (S.ch.size && !S.ch.has(r.ch))) continue;
      const { g, state } = r.a;
      const dim = S.focus && !matchesFocus(r);
      const base = { id: r.id, ch: r.ch, state, t: r.t, dim };
      if (r.kind === 'event') { if (S.cal.types.has('event')) spans.push({ ...base, s: g.evS, e: g.evE }); continue; }
      if (S.cal.types.has('post') && g.post != null) add(g.post, { ...base, type: 'post', o: 0 });
      if (S.cal.types.has('post') && g.ghost != null) add(g.ghost, { ...base, type: 'ghost', to: g.post, k: g.ghost, o: 1 });
      if (S.cal.types.has('fin') && g.fin != null && r.status !== 'live') add(g.fin, { ...base, type: 'fin', o: 2 });
      if (S.cal.types.has('cap') && g.cap != null && r.status !== 'live') add(g.cap, { ...base, type: 'cap', o: 3 });
      if (S.cal.types.has('brief') && g.brief != null) add(g.brief, { ...base, type: 'brief', o: 4 });
      if (S.cal.types.has('ms') && g.ms) for (const ms of g.ms) {
        if (ms.kind === 'goal' || ms.kind === 'delivery' || ms.who === 'Atlas') add(ms.d, { ...base, type: 'ms', ms, o: 5 });
      }
    }
    Object.values(byDay).forEach(l => l.sort((a, b) => a.o - b.o || (a.state === 'red' ? -1 : 0) - (b.state === 'red' ? -1 : 0)));
    return { byDay, spans };
  }

  function evHtml(e) {
    const flag = e.state === 'red' ? `<span class="flag" title="Can't post / slipped">${ic('alert', 'sm')}</span>` : e.state === 'amber' ? `<span class="flag" title="At risk">${ic('alert', 'sm')}</span>` : '';
    const st = e.state === 'red' ? 'red' : e.state === 'amber' ? 'amber' : e.state === 'live' ? 'live' : '';
    const dim = e.dim ? ' style="opacity:.28"' : '';
    if (e.type === 'post') return `<button class="ev post ${st}" data-ch="${e.ch}" data-open="${e.id}"${dim}${tipAttr(`${CH[e.ch].name} post · ${STATE_WORD[e.state]}`, e.t)}><span class="gl"></span><span class="t">${esc(e.t)}</span>${flag}</button>`;
    if (e.type === 'ghost') return `<button class="ev ghost ${e.to < e.k ? 'fwd' : ''}" data-open="${e.id}"${dim}${tipAttr(e.to < e.k ? 'Pulled forward from here' : 'Slipped from here', `${e.t} → ${fw(e.to)}`, e.to < e.k ? '' : 'tr')}><span class="gl"></span><span class="t">${esc(e.t)} → ${f(e.to)}</span></button>`;
    if (e.type === 'fin') return `<button class="ev fin ${e.state === 'red' ? 'red' : ''}" data-ch="${e.ch}" data-open="${e.id}"${dim}${tipAttr('Final asset due', e.t)}><span class="gl"></span><span class="pre">Final</span><span class="t">${esc(e.t)}</span></button>`;
    if (e.type === 'cap') return `<button class="ev cap" data-ch="${e.ch}" data-open="${e.id}"${dim}${tipAttr('Capture / receive', e.t)}><span class="gl"></span><span class="pre">Capture</span><span class="t">${esc(e.t)}</span></button>`;
    if (e.type === 'brief') return `<button class="ev brief" data-ch="${e.ch}" data-open="${e.id}"${dim}${tipAttr('Brief sent', e.t)}><span class="gl"></span><span class="pre">Brief</span><span class="t">${esc(e.t)}</span></button>`;
    if (e.type === 'ms') return `<button class="ev ms ${e.ms.kind || ''}" data-ch="${e.ch}" data-open="${e.id}"${dim}${tipAttr(`${e.ms.who} · ${e.t}`, e.ms.label)}><span class="gl"></span><span class="pre">${esc(e.ms.who)}</span><span class="t">${esc(e.ms.label)}</span></button>`;
    return '';
  }

  function renderCalendarToolbar() {
    const m = ud(S.cal.month);
    const title = S.cal.mode === 'month' ? `${MONTHS[m.getUTCMonth()]} ${m.getUTCFullYear()}` : `${f(S.cal.week)} – ${f(S.cal.week + 6)}`;
    $('#tb-calendar').innerHTML = `
      <div class="cal-title">${esc(title)}</div>
      <div class="cal-nav"><button class="icon-btn" data-cal-step="-1" aria-label="Previous">${ic('chevL')}</button><button class="icon-btn" data-cal-today style="width:auto;padding:0 12px">Today</button><button class="icon-btn" data-cal-step="1" aria-label="Next">${ic('chevR')}</button></div>
      <div class="seg" role="group" aria-label="Calendar view"><button data-cal-mode="month" aria-pressed="${S.cal.mode === 'month'}">Month</button><button data-cal-mode="week" aria-pressed="${S.cal.mode === 'week'}">Week by channel</button></div>
      <span class="grow"></span>
      ${searchBox('q-calendar')}
      <div class="types" role="group" aria-label="Show">${TYPES.map(t => `<button class="tchip" data-ctype="${t.id}" aria-pressed="${S.cal.types.has(t.id)}">${t.name}</button>`).join('')}</div>
      ${chanChips()}`;
  }

  function renderCalendar() {
    renderCalendarToolbar();
    const { byDay, spans } = calEntries();
    const box = $('#cal');
    if (S.cal.mode === 'week') { box.innerHTML = renderChannelWeek(byDay, spans); return; }
    const first = S.cal.month;
    const fm = ud(first);
    const last = dn(new Date(Date.UTC(fm.getUTCFullYear(), fm.getUTCMonth() + 1, 0)).toISOString().slice(0, 10));
    const gs = mondayOf(first), ge = mondayOf(last) + 6;
    let html = `<div class="month"><div class="mh">${WD.map((d, i) => `<div class="${i >= 5 ? 'we' : ''}">${d}</div>`).join('')}</div>`;
    for (let w = gs; w <= ge; w += 7) {
      const th = themeFor(w);
      let posts = 0;
      for (let k = w; k < w + 7; k++) posts += (byDay[k] || []).filter(e => e.type === 'post' && !e.dim).length;
      const gap = posts === 0 && w + 6 >= TODAY && S.cal.types.has('post');
      const wsp = spans.filter(s => s.e >= w && s.s <= w + 6);
      let bars = '';
      wsp.forEach((s, i) => {
        const a = Math.max(s.s, w), b = Math.min(s.e, w + 6);
        bars += `<button class="span-bar ${s.state === 'live' ? 'live' : ''}" data-ch="${s.ch}" data-open="${s.id}" style="left:calc(${(a - w) / 7 * 100}% + 6px);width:calc(${(b - a + 1) / 7 * 100}% - 12px);top:${34 + i * 23}px"${tipAttr('Event', `${s.t} · ${fw(s.s)}${s.e !== s.s ? ' – ' + fw(s.e) : ''}`)}>${ic('dot', 'sm')}${esc(s.t)}</button>`;
      });
      let cells = '';
      for (let k = w; k < w + 7; k++) {
        const list = byDay[k] || [];
        const out = k < first || k > last;
        const shown = list.slice(0, 4);
        cells += `<div class="md ${dow(k) >= 5 ? 'we' : ''} ${out ? 'out' : ''} ${k === TODAY ? 'today' : ''} ${k === S.cal.sel ? 'picked' : ''}" data-day="${k}">
          <div class="dh"><button class="dn" data-day="${k}" aria-label="${fw(k)}: ${plural(list.length, 'entry', 'entries')}">${ud(k).getUTCDate()}</button></div>
          ${wsp.length ? `<div class="ev-space" style="height:${wsp.length * 23}px"></div>` : ''}
          <div class="evs">${shown.map(evHtml).join('')}${list.length > 4 ? `<button class="more" data-day="${k}">+${list.length - 4} more</button>` : ''}</div>
        </div>`;
      }
      html += `<div class="mw ${w === mondayOf(TODAY) ? 'current' : ''}">
        <div class="mw-theme"><span class="wk">Wk ${isoWeek(w)}</span><span class="th">${esc(th || '')}</span>${th ? '' : '<span class="wk">No theme set</span>'}<span class="cnt ${gap ? 'gap' : ''}">${gap ? 'No posts scheduled' : plural(posts, 'post')}</span></div>
        <div class="mdays">${bars}${cells}</div>
      </div>`;
    }
    const sel = S.cal.sel >= gs && S.cal.sel <= ge ? S.cal.sel : first;
    const sl = byDay[sel] || [];
    const se = spans.filter(s => s.s <= sel && s.e >= sel);
    html += `</div><section class="daylist" aria-label="${fw(sel)}"><div class="dl-h"><span class="disp">${fw(sel)}</span><span class="lbl">${esc(themeFor(sel) || '')} · ${rel(sel)}</span></div>
      ${se.map(s => `<button class="ev post" data-ch="${s.ch}" data-open="${s.id}"><span class="gl"></span><span class="t">${esc(s.t)}</span></button>`).join('')}${sl.map(evHtml).join('') || (se.length ? '' : '<div class="lbl" style="padding:8px 6px">Nothing scheduled</div>')}</section>`;
    box.innerHTML = html;
  }

  function renderChannelWeek(byDay, spans) {
    const w = S.cal.week;
    const th = themeFor(w);
    let head = `<div class="cw-h"><div class="d1">Wk ${isoWeek(w)}</div><div class="d2" style="font-family:var(--f-display);font-size:14px;text-transform:uppercase;line-height:1.05">${esc(th || 'No theme set')}</div></div>`;
    for (let k = w; k < w + 7; k++) head += `<div class="cw-h ${dow(k) >= 5 ? 'we' : ''} ${k === TODAY ? 'today' : ''}"><div class="d1">${WD[dow(k)]}</div><div class="d2">${ud(k).getUTCDate()}</div></div>`;
    let body = '';
    for (const c of DATA.channels) {
      if (S.ch.size && !S.ch.has(c.id)) continue;
      body += `<div class="cw-lane" data-ch="${c.id}"><span class="chdot" style="margin-top:3px"></span><span class="nm">${esc(c.name)}</span></div>`;
      for (let k = w; k < w + 7; k++) {
        const list = (byDay[k] || []).filter(e => e.ch === c.id);
        const evs = spans.filter(s => s.ch === c.id && s.s <= k && s.e >= k).map(s => `<button class="ev post" data-ch="${s.ch}" data-open="${s.id}"><span class="gl"></span><span class="t">${esc(s.t)}</span></button>`).join('');
        body += `<div class="cw-cell ${dow(k) >= 5 ? 'we' : ''}">${evs}${list.map(evHtml).join('')}</div>`;
      }
    }
    return `<div class="cw"><div class="cw-grid">${head}${body}</div></div>`;
  }

  // ── Activity: a briefing list, one row per channel ─────────────────────
  function renderActivityToolbar() {
    const f2 = S.actFilter;
    const pending = ACTS.filter(a => a.state === 'pending').length;
    const denied = ACTS.filter(a => a.state === 'denied').length;
    const anyOpen = DATA.channels.some(c => S.openCh[c.id]);
    $('#tb-activity').innerHTML = `
      <h1>Activity</h1>
      ${searchBox('q-activity')}
      <div class="seg" role="group" aria-label="Show items"><button data-actf="open" aria-pressed="${f2 === 'open'}">Open</button><button data-actf="blocked" aria-pressed="${f2 === 'blocked'}">Blocked</button><button data-actf="waiting" aria-pressed="${f2 === 'waiting'}">Waiting</button><button data-actf="all" aria-pressed="${f2 === 'all'}">All</button></div>
      <button class="icon-btn" data-ch-all>${ic(anyOpen ? 'chevR' : 'chevD')}${anyOpen ? 'Collapse all' : 'Expand all'}</button>
      <span class="grow"></span>
      ${PRIV() && pending ? `<button class="icon-btn" data-show-new>${ic('spark')}${pending} new from Claude</button>` : ''}
      ${PRIV() && denied ? `<button class="icon-btn" data-show-denied>${ic('x')}Denied (${denied})</button>` : ''}
      <button class="icon-btn" data-export>${ic('download')}Export</button>`;
  }

  const actText = a => [a.title, a.detail, a.owner, a.wait, a.impact].join(' ').toLowerCase();
  const qMatch = a => !S.q || S.q.toLowerCase().split(/\s+/).every(w => actText(a).includes(w));
  const actMatches = a => {
    if (!qMatch(a)) return false;
    const fl = S.focus === 'waiting' ? 'waiting' : S.actFilter;
    if (fl === 'open') return a.status !== 'done';
    if (fl === 'blocked') return a.status === 'blocked';
    if (fl === 'waiting') return a.status === 'waiting' || a.status === 'blocked';
    return true;
  };

  const OPEN_LABEL = { gmail: 'Open thread', slack: 'Open message', granola: 'Open note' };
  function srcLine(s, withLink) {
    if (!s) return '';
    const link = withLink && s.url ? `<a class="open-src" href="${esc(s.url)}" target="_blank" rel="noopener">${OPEN_LABEL[s.type] || 'Open'} ${ic('link')}</a>` : '';
    return `<span class="src srcline">${ic(SRC_ICON[s.type] || 'note')}<span class="r">${SRC_NAME[s.type] || ''} · ${esc(s.ref)}${s.date ? ' · ' + f(dn(s.date)) : ''}</span>${link}</span>`;
  }

  const visChip = a => `<button class="vis-chip ${a.vis}" data-vis-toggle="${a.id}" title="${a.vis === 'team' ? 'Visible to the team. Click to make it only yours.' : 'Only you can see this. Click to share it with the team.'}">${ic(a.vis === 'team' ? 'users' : 'lock')}${a.vis === 'team' ? 'Team' : 'Only you'}</button>`;
  const statusPill = a => CAN_EDIT() && a.state !== 'pending'
    ? `<button class="pill ${a.status}" data-status-menu="${a.id}" aria-label="Status: ${STATUS_LABEL[a.status]}. Change">${ic(STATUS_ICON[a.status])}${STATUS_LABEL[a.status]}</button>`
    : `<span class="pill ${a.status}">${ic(STATUS_ICON[a.status])}${STATUS_LABEL[a.status]}</span>`;

  // the drawer's "What's happening" keeps the card form
  function cardHtml(a) {
    return `<article class="card ${a.status === 'done' ? 'done' : ''}" data-act="${a.id}">${itemDetail(a, true)}</article>`;
  }

  function itemDetail(a, inCard) {
    const due = dn(a.due);
    const overdue = due != null && due < TODAY && a.status !== 'done';
    const links = (a.links || []).filter(id => R[id]);
    const s = a.src || {};
    return `${inCard ? `<div class="ct">${esc(a.title)}</div>` : ''}
      <div class="row1">${statusPill(a)}${a.kind === 'date_change' ? `<span class="pill change">${ic('arrow')}Date change</span>` : ''}${due != null ? `<span class="pill date ${overdue ? 'overdue' : ''}">${overdue ? 'Overdue · ' : 'Due '}${f(due)}</span>` : ''}</div>
      ${a.detail ? `<p class="cd">${esc(a.detail)}</p>` : ''}
      ${(a.owner || a.wait) ? `<div class="who">${a.owner ? `<span>Owner <b>${esc(a.owner)}</b></span>` : ''}${a.wait ? `<span>Waiting on <b>${esc(a.wait)}</b></span>` : ''}</div>` : ''}
      ${a.impact ? `<div class="impact">${ic('arrow')}<span>${esc(a.impact)}</span></div>` : ''}
      ${links.length ? `<div class="links">${links.map(id => `<button class="linked" data-open="${id}">${ic('gantt')}<span>${esc(R[id].t)}</span>${stIcon(R[id].a.state)}</button>`).join('')}</div>` : ''}
      ${PRIV() ? `<div class="priv"><div class="priv-h">${ic('lock')}Only you</div>
        ${srcLine(a.src, true)}
        ${s.quote ? `<div class="quote">${esc(s.quote)}</div>` : ''}
        ${a.state !== 'pending' ? `<div class="own-acts">${visChip(a)}<span class="sp"></span>
          <button class="btn sm" data-done="${a.id}">${ic(a.status === 'done' ? 'reset' : 'check')}${a.status === 'done' ? 'Reopen' : 'Done'}</button>
          <button class="btn sm" data-remove="${a.id}">${ic('x')}Remove</button></div>` : ''}
      </div>` : ''}`;
  }

  const shortWho = w => String(w || '').split(/[(·/,]/)[0].replace(/^(Waiting on|Owner)\s+/i, '').trim();
  function channelStatus(ch, approved) {
    const open = approved.filter(a => a.cat === ch && a.status !== 'done');
    const blocked = open.filter(a => a.status === 'blocked');
    const waiting = open.filter(a => a.status === 'waiting');
    const content = Object.values(R).filter(r => r.ch === ch && r.a.state !== 'live');
    const redSoon = content.filter(r => r.a.state === 'red' && (r.a.g.post == null || r.a.g.post <= TODAY + 14));
    const state = blocked.length ? 'blocked' : (waiting.length || redSoon.length) ? 'attention' : 'ok';
    const people = [...new Set([...blocked, ...waiting].map(a => shortWho(a.wait)).filter(Boolean))];
    const next = [];
    open.forEach(a => { const d = dn(a.due); if (d != null && d >= TODAY) next.push({ d, t: a.title }); });
    content.forEach(r => {
      const g = r.a.g;
      if (g.post != null && g.post >= TODAY) next.push({ d: g.post, t: `${r.t} ${r.kind === 'launch' ? 'launches' : 'posts'}` });
      if (g.evS != null && g.evS >= TODAY) next.push({ d: g.evS, t: r.t });
      (g.ms || []).forEach(m => { if (m.d >= TODAY && (m.kind === 'goal' || m.kind === 'delivery')) next.push({ d: m.d, t: m.label.replace(/^Goal:\s*/, '').replace(/\.$/, '') }); });
    });
    next.sort((a, b) => a.d - b.d);
    return { state, open, blocked, waiting, people, next: next[0] };
  }
  const STATE_WORDS = { blocked: 'Has blockers', attention: 'Needs attention', ok: 'On track' };

  function itemRow(a) {
    const open = S.openItems.has(a.id);
    const due = dn(a.due);
    const overdue = due != null && due < TODAY && a.status !== 'done';
    const right = due != null && a.status !== 'done' ? `${overdue ? 'Overdue' : 'Due'} ${f(due)}` : shortWho(a.wait) || a.owner || '';
    const s = a.src || {};
    return `<div class="bl-item ${a.status} ${open ? 'open' : ''} ${S.flash === a.id ? 'flash' : ''}" data-item-toggle="${a.id}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="st-ic" title="${STATUS_LABEL[a.status]}">${ic(STATUS_ICON[a.status])}</span>
        <span class="bl-t">${esc(a.title)}</span>
        <span class="bl-who ${overdue ? 'overdue' : ''}">${esc(right)}</span>
        <span class="bl-src">${PRIV() && s.type ? ic(SRC_ICON[s.type] || 'note', 'sm') : ''}${PRIV() && a.vis === 'private' ? ic('lock', 'sm') : ''}</span>
        <span class="chev-s">${ic(open ? 'chevD' : 'chevR', 'sm')}</span>
      </div>${open ? `<div class="bl-detail">${itemDetail(a)}</div>` : ''}`;
  }

  function newRow(a) {
    const open = S.openItems.has(a.id);
    const due = dn(a.due);
    const s = a.src || {};
    return `<div class="nw-item ${open ? 'open' : ''}" data-q="${a.id}">
      <div class="nw-row">
        <span class="spark-s">${ic('spark')}</span>
        <button class="bl-t nw-t" data-item-toggle="${a.id}" aria-expanded="${open}">${esc(a.title)}</button>
        <span class="bl-src" title="${SRC_NAME[s.type] || ''}">${s.type ? ic(SRC_ICON[s.type] || 'note', 'sm') : ''}</span>
        <div class="seg vis-seg" role="group" aria-label="Who can see it"><button data-qvis="${a.id}" data-v="team" aria-pressed="${a.vis === 'team'}">${ic('users', 'sm')}Team</button><button data-qvis="${a.id}" data-v="private" aria-pressed="${a.vis !== 'team'}">${ic('lock', 'sm')}Only you</button></div>
        <button class="btn sm" data-deny="${a.id}" title="Not needed. Claude won't suggest it again.">Deny</button>
        <button class="btn sm" data-complete="${a.id}" title="Already taken care of. Logged as done.">${ic('check')}Completed</button>
        <button class="btn sm primary" data-approve="${a.id}" title="Add it to this channel">Approve</button>
      </div>
      ${open ? `<div class="bl-detail">${itemDetail(a)}
        <label class="nw-move">Belongs in <select data-q-cat="${a.id}">${DATA.channels.map(c => `<option value="${c.id}" ${c.id === a.cat ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label></div>` : ''}
    </div>`;
  }

  function addForm(c) {
    return `<form class="add-form" data-add-form="${c.id}">
      <input name="title" placeholder="What needs to happen?" required aria-label="Title">
      <div class="r"><select name="status" aria-label="Status">${Object.keys(STATUS_LABEL).filter(s => s !== 'done').map(s => `<option value="${s}" ${s === 'todo' ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select><input name="due" type="date" aria-label="Due date"></div>
      <div class="r"><input name="owner" placeholder="Owner" aria-label="Owner"><input name="wait" placeholder="Waiting on" aria-label="Waiting on"></div>
      <select name="vis" aria-label="Who can see it"><option value="team">Visible to the team</option><option value="private">Only me</option></select>
      <select name="link" aria-label="Affects content"><option value="">Affects no content item</option>${BASE.filter(i => i.ch === c.id).map(i => `<option value="${i.id}">${esc(i.t)}</option>`).join('')}</select>
      <div class="r"><button type="button" class="btn" data-add-cancel>Cancel</button><button class="btn primary" type="submit">Add</button></div>
    </form>`;
  }

  function channelRow(c, approved, pendingAll) {
    const st = channelStatus(c.id, approved);
    const t = { ...((DATA.status || {})[c.id] || {}), ...(S.tldr[c.id] || {}) };
    const state = t.state && STATE_WORDS[t.state] ? t.state : st.state;
    const upd = dn(t.updated);
    const stale = upd != null && TODAY - upd > 7;
    const mine = approved.filter(a => a.cat === c.id);
    const list = mine.filter(a => a.status !== 'done' || S.actFilter === 'all').filter(actMatches)
      .sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || (dn(a.due) ?? 1e9) - (dn(b.due) ?? 1e9));
    const done = mine.filter(a => a.status === 'done' && qMatch(a));
    const pending = pendingAll.filter(a => a.cat === c.id && qMatch(a));
    const auto = (S.q || S.focus === 'waiting') && (list.length || pending.length);
    const open = !!(S.openCh[c.id] || auto);
    const editing = S.editingTldr === c.id && CAN_EDIT();
    const meta = [
      st.people.length ? `<div><dt>Waiting on</dt><dd title="${esc(st.people.join(', '))}">${esc(st.people.join(', '))}</dd></div>` : '',
      st.next ? `<div><dt>Next</dt><dd title="${esc(fw(st.next.d) + ' · ' + st.next.t)}"><span class="mono">${fw(st.next.d)}</span> · ${esc(st.next.t)}</dd></div>` : ''
    ].join('');
    const showDone = S.showDone[c.id];
    return `<section class="bl-row ${open ? 'is-open' : ''}" data-ch="${c.id}" aria-label="${esc(c.name)}">
      <div class="bl-head" data-ch-toggle="${c.id}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="chev">${ic(open ? 'chevD' : 'chevR')}</span>
        <span class="bl-name"><span class="state-dot ${state}" title="${STATE_WORDS[state]}${t.state && STATE_WORDS[t.state] ? ' (set by Zoe)' : ''}"></span><h3>${esc(c.name)}</h3></span>
        <p class="bl-tldr">${t.text ? esc(t.text) : '<span class="empty">No summary yet.</span>'}${stale ? `<span class="stale">Updated ${f(upd)} · may be out of date</span>` : ''}${CAN_EDIT() ? `<button class="mini tldr-edit" data-tldr-edit="${c.id}" aria-label="Edit the ${esc(c.name)} summary" title="Edit summary">${ic('note')}</button>` : ''}</p>
        <dl class="bl-meta">${meta}</dl>
        <span class="bl-n">${pending.length ? `<span class="new-pill" title="New from Claude">${ic('spark')}${pending.length} new</span>` : ''}${st.open.length} open</span>
      </div>
      ${open || editing ? `<div class="bl-body">
        ${editing ? `<form class="tldr-form" data-tldr-form="${c.id}"><textarea name="text" rows="3" aria-label="${esc(c.name)} summary">${esc(t.text || '')}</textarea>
          <select name="state" aria-label="Channel status"><option value="auto" ${!t.state || t.state === 'auto' ? 'selected' : ''}>Status dot: automatic (${STATE_WORDS[st.state].toLowerCase()})</option>${Object.entries(STATE_WORDS).map(([k, v]) => `<option value="${k}" ${t.state === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <div class="r"><button type="button" class="btn" data-tldr-cancel>Cancel</button><button class="btn primary" type="submit">Save</button></div></form>` : ''}
        ${open ? `
          ${list.map(itemRow).join('') || `<div class="bl-empty">${mine.length ? 'Nothing matches this filter.' : 'Nothing logged yet.'}</div>`}
          ${pending.length ? `<div class="nw"><div class="nw-h">${ic('spark')}New from Claude for ${esc(c.name)} · ${pending.length}<span class="hint">Approve to add it, Completed if it's already handled, Deny if it isn't needed.</span></div>${pending.map(newRow).join('')}</div>` : ''}
          ${(done.length && S.actFilter !== 'all') || CAN_EDIT() ? `<div class="bl-foot">
            ${done.length && S.actFilter !== 'all' ? `<button data-done-toggle="${c.id}"><span class="done-ic">${ic('check')}</span>${done.length} done ${ic(showDone ? 'chevD' : 'chevR', 'sm')}</button>` : ''}
            ${CAN_EDIT() ? `<button data-add="${c.id}">${ic('plus')}Add to ${esc(c.name)}</button>` : ''}
          </div>` : ''}
          ${showDone && S.actFilter !== 'all' ? `<div class="bl-doneList">${done.map(itemRow).join('')}</div>` : ''}
          ${S.addingIn === c.id ? addForm(c) : ''}` : ''}
      </div>` : ''}
    </section>`;
  }

  function renderActivity() {
    renderActivityToolbar();
    const approved = ACTS.filter(a => a.state === 'approved' || a.state === 'completed');
    const pending = PRIV() ? ACTS.filter(a => a.state === 'pending') : [];
    $('#briefing').innerHTML = DATA.channels.map(c => channelRow(c, approved, pending)).join('');
  }

  function decide(id, decision, msg) {
    const a = ACTS.find(x => x.id === id);
    if (!a) return;
    S.decisions[id] = decision; save('decisions');
    S.openItems.delete(id);
    if (decision !== 'denied') { S.openCh[a.cat] = true; save('openCh'); S.flash = id; }
    if (decision === 'completed') { S.showDone[a.cat] = true; }
    refresh();
    setTimeout(() => { S.flash = null; }, 1200);
    toast(msg(a), () => { delete S.decisions[id]; save('decisions'); refresh(); });
  }
  const approve = id => decide(id, 'approved', a => `Added to ${CH[a.cat].name} · ${a.vis === 'team' ? 'visible to the team' : 'only you'}`);
  const complete = id => decide(id, 'completed', a => `Logged as done in ${CH[a.cat].name}`);
  const deny = id => decide(id, 'denied', () => 'Denied. Claude won\'t suggest it again');

  function deniedPop(anchor) {
    const denied = ACTS.filter(a => a.state === 'denied');
    openPop(anchor, `<h4>Denied</h4><div class="sub">Not needed · Claude won't suggest these again</div>
      <div class="dismissed-list">${denied.map(a => `<div class="dn-row"><span>${esc(a.title)}</span><button class="mini" data-undeny="${a.id}" title="Move back to new" aria-label="Move back to new">${ic('reset')}</button></div>`).join('') || '<div class="sub">Nothing denied.</div>'}</div>`, 360);
  }

  // ── Drawer ─────────────────────────────────────────────────────────────
  function syncHash() {
    try { history.replaceState(null, '', `#${S.view}${S.sel ? '/' + S.sel : ''}`); } catch (e) { /* file:// or sandboxed */ }
  }
  function openDrawer(id) {
    S.sel = id;
    syncHash();
    renderDrawer();
    $('#drawer').classList.add('open');
    $('#scrim').classList.add('on');
    $$('.g-row.item').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
    setTimeout(() => $('#drawer').focus({ preventScroll: true }), 60);
  }
  function closeDrawer() {
    if (!S.sel) return;
    const id = S.sel;
    S.sel = null;
    syncHash();
    $('#drawer').classList.remove('open');
    $('#scrim').classList.remove('on');
    $$('.g-row.item.sel').forEach(r => r.classList.remove('sel'));
    const back = $(`.g-row.item[data-id="${id}"] .g-label`);
    if (back && S.view === 'timeline') back.focus({ preventScroll: true });
  }

  function verdictHtml(r) {
    const { state, flags, g } = r.a;
    let head;
    const reds = flags.filter(x => x.lv === 'red');
    if (state === 'red') head = g.post != null && reds.some(x => ['cant', 'buffer', 'fit', 'act', 'brief'].includes(x.code)) ? `Can't post on ${fw(g.post)} as things stand` : reds[0].t;
    else if (state === 'amber') head = g.post != null ? `At risk for ${fw(g.post)}` : 'At risk';
    else if (state === 'ready') head = g.post != null ? `Asset ready. Posts ${fw(g.post)}.` : 'Asset ready.';
    else if (state === 'live') head = r.kind === 'event' ? 'This event has happened.' : `Live${g.post != null ? ` since ${fw(g.post)}` : ''}.`;
    else if (state === 'none') head = 'Not scheduled yet. Add dates to put it on the timeline.';
    else if (state === 'event') head = `Upcoming event, ${fw(g.evS)}${g.evE !== g.evS ? ` – ${fw(g.evE)}` : ''}.`;
    else head = g.post != null ? `On track to post ${fw(g.post)}.` : r.kind === 'project' ? `On track. Wraps ${fw(g.end)}.` : 'On track.';
    const rest = flags.filter(x => x.t !== head);
    const list = rest.length ? `<ul>${rest.map(x => `<li class="${x.lv}">${esc(x.t)}${x.priv ? ` <span class="only-you">${ic('lock', 'sm')}only you</span>` : ''}</li>`).join('')}</ul>` : '';
    const earliest = state === 'red' && g.earliestPost != null && g.post != null && g.earliestPost > g.post ? `<ul><li>Earliest realistic post under the current rules: <b>${fw(g.earliestPost)}</b></li></ul>` : '';
    return `<div class="verdict ${state === 'red' ? 'red' : state === 'amber' ? 'amber' : ''}">${stIcon(state)}<div><div class="vt">${esc(head)}</div>${list}${earliest}</div></div>`;
  }

  function dateField(r, key, label) {
    const v = r[key] || '';
    const changed = S.overrides[r.id] && key in S.overrides[r.id];
    return `<input class="dateinp ${changed ? 'changed' : ''}" type="date" data-edit="${key}" value="${esc(v)}" aria-label="${esc(label)}"${CAN_EDIT() ? '' : ' disabled'}>`;
  }

  function renderDrawer() {
    const r = R[S.sel];
    if (!r) return;
    const { state, g } = r.a;
    const sec = SEC[r.sec];
    const rl = S.rules;
    let body = verdictHtml(r);

    if (!r.kind || r.kind === 'launch') {
      const ws = g.workS, rs = g.revS;
      const clear = g.post != null && g.fin != null ? g.post - g.fin - 1 : null;
      const steps = r.kind === 'launch' ? `
        <div class="cs"><span class="node"><i class="n-post"></i></span><span class="k">Launch<small>${g.ghost != null ? `<span class="${g.post > g.ghost ? 'red' : ''}">Planned ${f(g.ghost)} (${g.post - g.ghost > 0 ? '+' : ''}${g.post - g.ghost} days)</span>` : 'Ready for launch'}</small></span><span class="v">${dateField(r, 'post', 'Launch date')}</span></div>` : `
        <div class="cs"><span class="node"><i class="n-brief"></i></span><span class="k">Brief sent<small class="${g.briefDue != null ? 'red' : ''}">${g.briefDue != null ? `Was due ${f(g.briefDue)}, not sent` : g.brief != null && g.cap != null ? `With talent for ${plural(g.cap - g.brief, 'day')}` : 'Pitch, deck or creative brief'}</small></span><span class="v">${dateField(r, 'brief', 'Brief sent')}</span></div>
        <div class="cs"><span class="node"><i class="n-cap"></i></span><span class="k">${r.ch === 'press' ? 'Receive' : 'Capture / receive'}<small class="${(r.tbc || []).includes('cap') ? 'amber' : ''}">${(r.tbc || []).includes('cap') ? 'Date TBC' : 'Shoot, footage or data in hand'}</small></span><span class="v">${dateField(r, 'cap', 'Capture date')}</span></div>
        <div class="cs"><span class="node"><i class="n-work"></i></span><span class="k">Work days needed<small>${g.fin != null && ws < rs ? (rs - ws > g.wd ? `Window ${f(ws)} – ${f(rs - 1)} · ${plural(rs - ws - g.wd, 'day')} of slack` : `${f(ws)} – ${f(rs - 1)} · no slack`) : g.fin != null ? '<span class="red">No time left for work</span>' : 'Starts the day after capture'}</small></span><span class="v"><input class="dateinp numinp ${S.overrides[r.id] && 'work' in S.overrides[r.id] ? 'changed' : ''}" type="number" min="1" max="60" data-edit="work" value="${esc(r.work || rl.workDays)}" aria-label="Work days"${CAN_EDIT() ? '' : ' disabled'}><span class="ro">days</span></span></div>
        <div class="cs"><span class="node"><i class="n-review"></i></span><span class="k">${rl.reviewDays * 24}h review<small>${g.fin != null ? `Wraps as the final asset lands ${f(g.fin)}` : 'Captions, approvals, final changes'}</small></span><span class="v"><span class="ro">${g.fin != null ? `${f(rs)} – ${f(g.fin - 1)}` : '—'}</span></span></div>
        <div class="cs"><span class="node"><i class="n-final"></i></span><span class="k">Final asset due<small>${r.feeds ? `Day before the ${esc(BYID[r.feeds].t)} final asset. Moves with it.` : r.plan && r.plan.fin ? `Planned ${f(dn(r.plan.fin))}` : 'Delivered and approved'}</small></span><span class="v">${dateField(r, 'fin', 'Final asset due')}</span></div>
        ${r.feeds ? '' : `<div class="cs"><span class="node"><i class="n-clear"></i></span><span class="k">Clear days<small>At least ${plural(rl.clearDays, 'day')} between final and post</small></span><span class="v"><span class="ro ${clear != null && clear < rl.clearDays ? 'red' : ''}">${clear == null ? '—' : plural(Math.max(clear, 0), 'day')}</span></span></div>
        <div class="cs"><span class="node"><i class="n-post"></i></span><span class="k">Post / live<small class="${g.ghost != null && g.post > g.ghost ? 'red' : (r.tbc || []).includes('post') ? 'amber' : ''}">${g.ghost != null ? `Planned ${f(g.ghost)} (${g.post - g.ghost > 0 ? '+' : ''}${g.post - g.ghost} days)` : (r.tbc || []).includes('post') ? 'TBC' : g.post != null ? rel(g.post) : 'Not set'}</small></span><span class="v">${dateField(r, 'post', 'Post date')}</span></div>`}`;
      body += `<section><h3>${r.kind === 'launch' ? 'Launch date' : 'Brief to post'}<span class="grow"></span></h3><div class="chain state-${state}">${steps}</div></section>`;
    } else if (r.kind === 'event') {
      body += `<section><h3>Dates<span class="grow"></span></h3><div class="ms-list"><div class="ms-row"><span class="d">${f(g.evS)}</span><span class="tx">${g.evE !== g.evS ? `Runs ${fw(g.evS)} to ${fw(g.evE)}` : fw(g.evS)}</span></div></div></section>`;
    } else if (r.kind === 'project') {
      body += `<section><h3>Phases<span class="grow"></span></h3><div class="ms-list">${g.segs.map(s => `<div class="ms-row ${s.who === 'Atlas' ? 'atlas' : ''}"><span class="d">${f(s.s)}${s.e !== s.s ? `–${ud(s.e).getUTCDate()}` : ''}</span><span class="tx"><b>${esc(s.who)}</b>${esc(s.label)}${s.ps != null && (s.ps !== s.s || s.pe !== s.e) ? ` <span style="color:var(--amber-ink)">(was ${f(s.ps)}${s.pe !== s.ps ? `–${ud(s.pe).getUTCDate()}` : ''})</span>` : ''}</span></div>`).join('')}</div></section>`;
    }

    if (g.ms && g.ms.length) {
      body += `<section><h3>Day by day<span class="grow"></span><span class="lbl" style="color:var(--ink-4)">From the Overview tab</span></h3><div class="ms-list">${g.ms.map(m => `<div class="ms-row ${m.who === 'Atlas' ? 'atlas' : ''}"><span class="d ${m.d === TODAY ? 'today' : m.d < TODAY ? 'past' : ''}">${WD[dow(m.d)]} ${f(m.d)}</span><span class="tx"><b>${esc(m.who)}</b>${esc(m.label)}</span></div>`).join('')}</div></section>`;
    }

    const linked = ACTS.filter(a => a.state === 'approved' && (a.links || []).includes(r.id));
    if (linked.length) body += `<section><h3>What's happening<span class="grow"></span></h3><div style="display:flex;flex-direction:column;gap:8px">${linked.map(cardHtml).join('')}</div></section>`;
    if (r.notes) body += `<section><h3>Notes<span class="grow"></span></h3><div class="notes">${esc(r.notes)}</div></section>`;
    if (PRIV() && ACT.notes && ACT.notes[r.id]) body += `<section class="private-note"><h3>${ic('lock', 'sm')}Only you<span class="grow"></span></h3><div class="notes">${esc(ACT.notes[r.id])}</div></section>`;

    const srcName = r.moved === 'overview' || r.kind === 'project' || r.kind === 'launch' ? 'Production Timeline + Project Timeline Overview' : 'Production Timeline';
    $('#drawer').innerHTML = `
      <div class="dr-h">
        <div class="crumbs"><h2>${esc(r.t)}</h2><button class="mini" data-close aria-label="Close">${ic('x')}</button></div>
        <div class="tags"><span class="pill">${esc(sec.name)}${r.sub ? ' · ' + esc(r.sub) : ''}</span><span class="pill" data-ch="${r.ch}"><span class="chdot"></span>${esc(CH[r.ch].name)}</span>${r.who ? `<span class="pill">${ic('user')}${esc(r.who)}</span>` : ''}${r.vendor ? `<span class="pill">${esc(r.vendor)}</span>` : ''}${r.tag ? `<span class="pill">${esc(r.tag)}</span>` : ''}${r.edited ? '<span class="pill change">Edited here</span>' : ''}</div>
      </div>
      <div class="dr-b">${body}</div>
      <div class="dr-f">
        <span class="src">${ic('sheet')}<a class="r linkish" href="${esc((r.moved === 'overview' || r.kind === 'project' ? DATA.sources.overview : DATA.sources.timeline).url)}" target="_blank" rel="noopener">${srcName}</a></span>
        ${r.edited && CAN_EDIT() ? `<button class="btn" data-reset="${r.id}">${ic('reset')}Reset</button>` : ''}
        ${CAN_EDIT() && r.kind !== 'event' && r.kind !== 'project' && r.status !== 'live' && g.post != null ? `<button class="btn primary" data-live="${r.id}">${ic('check')}Mark live</button>` : ''}
        ${r.status === 'live' && r.edited ? '' : ''}
      </div>`;
  }

  // ── Popovers, tooltip, toast ───────────────────────────────────────────
  const pop = $('#pop');
  let popAnchor = null;
  function openPop(anchor, html, width) {
    pop.innerHTML = html;
    pop.hidden = false;
    pop.style.width = (width || 340) + 'px';
    const a = anchor.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let left = Math.min(window.innerWidth - pw - 12, Math.max(12, a.right - pw));
    let top = a.bottom + 8;
    if (top + ph > window.innerHeight - 12) top = Math.max(12, a.top - ph - 8);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    popAnchor = anchor;
    const first = pop.querySelector('input,button,select');
    if (first) first.focus({ preventScroll: true });
  }
  function closePop() { if (pop.hidden) return; pop.hidden = true; if (popAnchor && document.contains(popAnchor)) popAnchor.focus({ preventScroll: true }); popAnchor = null; }

  function rulesPop(anchor) {
    const rl = S.rules;
    openPop(anchor, `
      <h4>Timeline rules</h4>
      <div class="sub">These decide what turns red</div>
      <label class="field">Default work days<small>Used when a row has none</small><input type="number" min="1" max="30" data-rule="workDays" value="${rl.workDays}"></label>
      <label class="field">Review window (days)<small>Ends on the final asset date. 2 = 48 hours</small><input type="number" min="1" max="10" data-rule="reviewDays" value="${rl.reviewDays}"></label>
      <label class="field">Clear days before post<small>Between the final asset and posting</small><input type="number" min="0" max="10" data-rule="clearDays" value="${rl.clearDays}"></label>
      <label class="field">Brief warning (days)<small>Flag a missing brief this close to capture</small><input type="number" min="1" max="60" data-rule="briefWarnDays" value="${rl.briefWarnDays}"></label>
      <div class="row-btns"><button class="btn" data-rules-reset>${ic('reset')}Defaults</button><button class="btn" data-export>${ic('download')}Export</button></div>
      <div class="sub" style="text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:11.5px;line-height:1.45">${LIVE
        ? 'Edits, approvals and rules save automatically and show up for everyone with Private view straight away. Team view gets them once they are approved and marked Team.'
        : 'Edits, approvals and rules are saved in this browser only. <button class="linkish" data-wipe style="font-size:11.5px">Clear local edits</button>'}</div>`, 320);
  }

  function accountPop(anchor) {
    const me = LIVE.me;
    openPop(anchor, `
      <div class="sub">Signed in as</div>
      <h4 class="acct-email">${esc(me.email)}</h4>
      <div class="acct-tags"><span>${me.role === 'admin' ? 'Admin' : 'Standard'}</span><span>${me.view === 'private' ? 'Private view' : 'Team view'}</span></div>
      <div class="row-btns"><button class="btn" data-signout>${ic('signout')}Sign out</button></div>`, 280);
  }

  function statusMenu(anchor, id) {
    openPop(anchor, `<div class="sub">Set status</div>${Object.keys(STATUS_LABEL).map(s => `<button class="btn" style="justify-content:flex-start;padding:0 12px" data-set-status="${id}" data-v="${s}">${ic(STATUS_ICON[s])}${STATUS_LABEL[s]}</button>`).join('')}`, 200);
  }

  function dayPop(anchor, k) {
    const { byDay, spans } = calEntries();
    const list = byDay[k] || [];
    const ev = spans.filter(s => s.s <= k && s.e >= k);
    openPop(anchor, `<h4>${fw(k)}</h4><div class="sub">${esc(themeFor(k) || 'No theme set')} · ${rel(k)}</div>
      <div style="display:flex;flex-direction:column;gap:3px">${ev.map(s => `<button class="ev post" data-ch="${s.ch}" data-open="${s.id}"><span class="gl"></span><span class="t">${esc(s.t)}</span></button>`).join('')}${list.map(evHtml).join('') || (ev.length ? '' : '<div class="sub" style="text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:12px">Nothing scheduled.</div>')}</div>`, 320);
  }

  const tip = $('#tip');
  let tipEl = null;
  document.addEventListener('pointerover', e => {
    const t = e.target.closest('[data-tip]');
    if (!t || dragging) return;
    tipEl = t;
    tip.innerHTML = `<div class="tk">${esc(t.dataset.tip)}</div><div class="${t.dataset.tc || ''}">${esc(t.dataset.tv)}</div>`;
    tip.classList.add('on');
  });
  document.addEventListener('pointermove', e => {
    if (!tipEl) return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('pointerout', e => { if (tipEl && !tipEl.contains(e.relatedTarget)) { tipEl = null; tip.classList.remove('on'); } });

  const toastEl = $('#toast');
  let toastT = null;
  function toast(msg, undo) {
    clearTimeout(toastT);
    toastEl.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-undo>Undo</button>' : ''}`;
    toastEl.classList.add('on');
    toastEl._undo = undo;
    toastT = setTimeout(() => toastEl.classList.remove('on'), 4200);
  }
  toastEl.addEventListener('click', e => {
    if (e.target.closest('[data-undo]') && toastEl._undo) { toastEl._undo(); toastEl._undo = null; toastEl.classList.remove('on'); }
  });

  // ── Edits ──────────────────────────────────────────────────────────────
  function setOverride(id, key, val) {
    const o = { ...(S.overrides[id] || {}) };
    const base = BYID[id][key];
    if (val === '' || val == null) { if (base == null) delete o[key]; else o[key] = null; }
    else if (String(val) === String(base)) delete o[key];
    else o[key] = val;
    if (Object.keys(o).length) S.overrides[id] = o; else delete S.overrides[id];
    save('overrides');
  }
  function setAct(id, patch) {
    const added = S.added.find(a => a.id === id);
    if (added) { Object.assign(added, patch); save('added'); }
    else { S.actEdits[id] = { ...(S.actEdits[id] || {}), ...patch }; save('actEdits'); }
  }

  // ── Render orchestration ───────────────────────────────────────────────
  function renderView() {
    $$('.view').forEach(v => { v.hidden = v.id !== 'v-' + S.view; });
    if (S.view === 'timeline') { renderTimelineToolbar(); renderGantt(); renderLegend(); }
    if (S.view === 'calendar') renderCalendar();
    if (S.view === 'activity') renderActivity();
  }
  function refresh() {
    compute();
    renderChrome();
    renderPulse();
    renderView();
    if (S.sel) renderDrawer();
  }
  let rippleT = null;
  function ripple(id) {
    clearTimeout(rippleT);
    S.ripple = id;
    refresh();
    rippleT = setTimeout(() => { S.ripple = null; $$('.g-row.ripple').forEach(r => r.classList.remove('ripple')); }, 1200);
  }
  function setView(v, focusSearch) {
    if (S.view === v) return;
    S.view = v; save('view');
    syncHash();
    closePop();
    refresh();
    const sec = $('#v-' + v);
    sec.classList.remove('enter'); void sec.offsetWidth; sec.classList.add('enter');
    if (v === 'timeline') scrollGanttToToday(false);
    if (focusSearch) $(`#q-${v}`).focus();
  }

  // ── Events ─────────────────────────────────────────────────────────────
  document.addEventListener('click', e => {
    const t = e.target;
    let el;
    if ((el = t.closest('.tab'))) return setView(el.dataset.view);
    if ((el = t.closest('[data-viewas]'))) {
      S.preview = el.dataset.viewas === 'team';
      closeDrawer(); closePop();
      refresh();
      return toast(S.preview ? 'Previewing Team view' : 'Back to Private view');
    }
    if (t.closest('[data-share-team]')) return shareTeamFile();
    if (LIVE && (el = t.closest('[data-admin]'))) { closePop(); return LIVE.openAdmin(el); }
    if (LIVE && (el = t.closest('[data-account]'))) return pop.hidden ? accountPop(el) : closePop();
    if (LIVE && t.closest('[data-signout]')) return LIVE.signOut();
    if ((el = t.closest('[data-vis-toggle]'))) {
      const id = el.dataset.visToggle; const a = ACTS.find(x => x.id === id);
      const next = a.vis === 'team' ? 'private' : 'team';
      S.visEdits[id] = next; save('visEdits'); refresh();
      return toast(next === 'team' ? 'Now visible to the team' : 'Now only visible to you', () => { S.visEdits[id] = a.vis; save('visEdits'); refresh(); });

    if ((el = t.closest('[data-tldr-edit]'))) { S.editingTldr = el.dataset.tldrEdit; renderActivity(); const ta = $(`[data-tldr-form="${S.editingTldr}"] textarea`); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } return; }
