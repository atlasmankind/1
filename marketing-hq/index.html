<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Marketing HQ</title>
<meta name="description" content="Atlas content pipeline, posting calendar and channel activity in one place.">
<script>try { var t = localStorage.getItem('atlas-hq:theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}</script>
<style>
/* ── Atlas brand faces (inlined as data URIs by build.py) ───────────────── */

/* ── Tokens: Atlas after dark (default) ───────────────────────────────── */
:root {
  color-scheme: dark;
  --f-display: realms, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono: apercu, ui-monospace, "SF Mono", Menlo, monospace;
  --f-body: inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

  --bg: #000000;
  --s1: #0b0a0a;
  --s2: #131211;
  --s3: #1b1a19;
  --s4: #252321;
  --ink: #eeecea;
  --ink-2: #bdbab5;
  --ink-3: #97948f;
  --ink-4: #7d7a76;
  --line: rgba(238, 236, 234, 0.09);
  --line-2: rgba(238, 236, 234, 0.16);
  --line-3: rgba(238, 236, 234, 0.28);
  --weekend: rgba(238, 236, 234, 0.025);
  --glass: rgba(20, 19, 18, 0.72);

  --red: #e5534b;
  --red-ink: #f2756d;
  --red-wash: rgba(229, 83, 75, 0.14);
  --amber: #e8a33d;
  --amber-ink: #f0b65c;
  --amber-wash: rgba(232, 163, 61, 0.13);
  --good: #4fb07d;
  --good-ink: #6fc596;

  --bar-ok: rgba(238, 236, 234, 0.62);
  --bar-live: #4a4744;
  --orb-glow: 0 0 0 1px rgba(238, 236, 234, 0.9), 0 0 14px rgba(238, 236, 234, 0.45);

  /* channel identity, validated (adjacent CVD ΔE 13.2) on #0b0a0a */
  --c-press: #199e70;
  --c-events: #3987e5;
  --c-paid: #c98500;
  --c-email: #d55181;
  --c-organic: #9085e9;
  --c-web: #008300;

  --shadow-pop: 0 18px 50px -12px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.5);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --r: 6px;
  --r-lg: 10px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eeecea;
  --s1: #f5f4f2;
  --s2: #fbfaf9;
  --s3: #e7e4e0;
  --s4: #dcd8d3;
  --ink: #0a0909;
  --ink-2: #3c3a39;
  --ink-3: #5f5c58;
  --ink-4: #696662;
  --line: rgba(10, 9, 9, 0.09);
  --line-2: rgba(10, 9, 9, 0.15);
  --line-3: rgba(10, 9, 9, 0.28);
  --weekend: rgba(10, 9, 9, 0.028);
  --glass: rgba(245, 244, 242, 0.78);
  --red: #cf3b33;
  --red-ink: #b42c25;
  --red-wash: rgba(207, 59, 51, 0.1);
  --amber: #c9840f;
  --amber-ink: #8f5a00;
  --amber-wash: rgba(201, 132, 15, 0.12);
  --good: #2f8f5c;
  --good-ink: #1f7046;
  --bar-ok: rgba(10, 9, 9, 0.7);
  --bar-live: #b9b5b0;
  --orb-glow: 0 0 0 1px rgba(10, 9, 9, 0.85), 0 0 10px rgba(10, 9, 9, 0.18);
  --c-press: #1baf7a;
  --c-events: #2a78d6;
  --c-paid: #eda100;
  --c-email: #e87ba4;
  --c-organic: #4a3aa7;
  --c-web: #008300;
  --shadow-pop: 0 18px 50px -14px rgba(40, 30, 20, 0.28), 0 2px 8px rgba(40, 30, 20, 0.1);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="light"]) {
    color-scheme: light;
    --bg: #eeecea; --s1: #f5f4f2; --s2: #fbfaf9; --s3: #e7e4e0; --s4: #dcd8d3;
    --ink: #0a0909; --ink-2: #3c3a39; --ink-3: #5f5c58; --ink-4: #696662;
    --line: rgba(10, 9, 9, 0.09); --line-2: rgba(10, 9, 9, 0.15); --line-3: rgba(10, 9, 9, 0.28);
    --weekend: rgba(10, 9, 9, 0.028); --glass: rgba(245, 244, 242, 0.78);
    --red: #cf3b33; --red-ink: #b42c25; --red-wash: rgba(207, 59, 51, 0.1);
    --amber: #c9840f; --amber-ink: #8f5a00; --amber-wash: rgba(201, 132, 15, 0.12);
    --good: #2f8f5c; --good-ink: #1f7046;
    --bar-ok: rgba(10, 9, 9, 0.7); --bar-live: #b9b5b0;
    --orb-glow: 0 0 0 1px rgba(10, 9, 9, 0.85), 0 0 10px rgba(10, 9, 9, 0.18);
    --c-press: #1baf7a; --c-events: #2a78d6; --c-paid: #eda100; --c-email: #e87ba4; --c-organic: #4a3aa7; --c-web: #008300;
    --shadow-pop: 0 18px 50px -14px rgba(40, 30, 20, 0.28), 0 2px 8px rgba(40, 30, 20, 0.1);
  }
}

/* ── Base ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 13px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
::selection { background: var(--ink); color: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--s4) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--s4); border-radius: 10px; border: 3px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 13px; height: 13px; }
.i.fill { fill: currentColor; stroke: none; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.lbl { font: 400 10px/1.2 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-display); font-weight: 360; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.95; }

/* ── Top bar ──────────────────────────────────────────────────────────── */
.top {
  flex: none;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  height: 60px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  position: relative;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand .mark { font-family: var(--f-display); font-weight: 360; font-size: 25px; letter-spacing: 0.02em; line-height: 1; padding-top: 2px; }
.brand .rule { width: 1px; height: 20px; background: var(--line-2); }
.brand .name { font: 400 11px/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }

.tabs {
  display: flex;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 16px;
  border-radius: 999px;
  font: 400 11px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-3);
  transition: color 160ms var(--ease), background-color 160ms var(--ease);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab .count { font-size: 10px; min-width: 18px; height: 16px; padding: 0 5px; border-radius: 8px; display: inline-grid; place-items: center; background: var(--s4); color: var(--ink); letter-spacing: 0; }
.tab[aria-selected="true"] .count { background: var(--bg); color: var(--ink); }

.top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.sync { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.sync .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.mode {
  display: flex; align-items: center; gap: 2px; padding: 3px;
  border: 1px solid var(--line-2); border-radius: 999px;
}
.mode button { width: 28px; height: 26px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-3); transition: color 160ms, background-color 160ms; }
.mode button:hover { color: var(--ink); }
.mode button[aria-pressed="true"] { color: var(--ink); background: var(--s3); }
.icon-btn {
  height: 32px; min-width: 32px; padding: 0 10px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line-2); color: var(--ink-2);
  font: 400 10.5px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase;
  transition: color 160ms, border-color 160ms, background-color 160ms;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-3); background: var(--s2); }
.owner-tools { display: flex; align-items: center; gap: 8px; }
.owner-tools:empty { display: none; }
.whois { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 999px; }
.whois button { height: 26px; padding: 0 10px 0 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font: 400 10.5px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); transition: color 160ms, background-color 160ms; }
.whois button .i { width: 14px; height: 14px; }
.whois button:hover { color: var(--ink); }
.whois button[aria-pressed="true"] { background: var(--s3); color: var(--ink); }
.whois button[data-viewas="team"][aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.preview-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 9px 20px; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.35; }
.preview-bar[hidden] { display: none; }
.preview-bar > span { flex: 1; }
.preview-bar b { font-weight: 600; }
.preview-bar .btn { flex: none; height: 28px; padding: 0 12px; border-color: color-mix(in srgb, var(--bg) 30%, transparent); color: var(--bg); }
.preview-bar .btn:hover { background: color-mix(in srgb, var(--bg) 12%, transparent); color: var(--bg); }
.preview-bar .btn.primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.vis-chip { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px 0 5px; border-radius: 999px; font: 400 9.5px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line-2); transition: color 140ms, border-color 140ms, background-color 140ms; }
.vis-chip .i { width: 11px; height: 11px; stroke-width: 1.6; }
.vis-chip:hover { color: var(--ink); border-color: var(--line-3); }
.vis-chip.private { color: var(--ink); background: var(--s3); border-color: var(--line-3); }
.only-you { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; font: 400 9.5px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); vertical-align: 1px; }
.only-you .i { width: 11px; height: 11px; }
.private-note { border: 1px dashed var(--line-3); border-radius: var(--r-lg); padding: 12px 14px; }
.private-note h3 { margin-bottom: 8px; }
.private-note h3 .i { width: 12px; height: 12px; }
.vis-seg button { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; font-size: 9.5px; }
.vis-seg button .i { width: 11px; height: 11px; }
@media (max-width: 1600px) { body:not(.team-file) .sync .txt { display: none; } }

/* ── Pulse line ───────────────────────────────────────────────────────── */
.pulse {
  flex: none;
  display: flex; align-items: center; gap: 18px;
  min-height: 46px; padding: 8px 20px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.pulse::-webkit-scrollbar { display: none; }
.pulse .when { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
.pulse .when .day { font: 400 11px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
.pulse .when .theme { font-family: var(--f-display); font-weight: 360; font-size: 15px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-2); }
.pulse .sep { width: 1px; height: 18px; background: var(--line-2); flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  height: 28px; padding: 0 12px 0 10px; border-radius: 999px;
  border: 1px solid var(--line-2);
  font: 400 11px/1 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2);
  white-space: nowrap;
  transition: background-color 160ms, border-color 160ms, color 160ms;
}
.chip:hover { border-color: var(--line-3); color: var(--ink); }
.chip b { font-weight: 500; color: var(--ink); }
.chip .pip { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.red .pip { background: var(--red); }
.chip.amber .pip { background: var(--amber); }
.chip.wait .pip { border: 1.5px solid var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] b { color: var(--bg); }
.next { display: flex; align-items: center; gap: 10px; white-space: nowrap; margin-left: auto; padding-left: 8px; }
.next .orb { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); box-shadow: var(--orb-glow); flex: none; }
.next a, .linkish { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-3); text-underline-offset: 3px; cursor: pointer; }
.next a:hover, .linkish:hover { text-decoration-color: var(--ink); }

/* ── Views ────────────────────────────────────────────────────────────── */
main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
.view[hidden] { display: none; }
.view.enter { animation: viewIn 220ms var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(4px); } }

.toolbar {
  flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 20px 12px;
}
.toolbar h1 { margin: 0 12px 0 0; font-family: var(--f-display); font-weight: 360; font-size: 30px; line-height: 0.9; letter-spacing: 0.01em; text-transform: uppercase; padding-top: 3px; }
.toolbar .grow { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
  border: 1px solid var(--line-2); border-radius: 999px; color: var(--ink-3); width: 180px;
  transition: border-color 160ms;
}
.search:focus-within { border-color: var(--line-3); color: var(--ink); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: 400 12px/1 var(--f-body); color: var(--ink); }
.search input::placeholder { color: var(--ink-4); }
.search kbd { font: 400 10px/1 var(--f-mono); color: var(--ink-4); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 5px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { height: 24px; padding: 0 11px; border-radius: 999px; font: 400 10.5px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); transition: color 160ms, background-color 160ms; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--s3); color: var(--ink); }
.chans { display: flex; gap: 4px; flex-wrap: wrap; }
.cchip {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px 0 9px; flex: none; white-space: nowrap;
  border-radius: 999px; border: 1px solid var(--line);
  font: 400 10.5px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3);
  transition: color 160ms, border-color 160ms, opacity 160ms, background-color 160ms;
}
.cchip .sw { width: 8px; height: 8px; border-radius: 2px; }
.cchip:hover { color: var(--ink); border-color: var(--line-2); }
.cchip[aria-pressed="true"] { color: var(--ink); border-color: var(--line-3); background: var(--s2); }
.chans.some .cchip[aria-pressed="false"] { opacity: 0.5; }

/* channel swatches */
[data-ch="press"] { --ch: var(--c-press); }
[data-ch="events"] { --ch: var(--c-events); }
[data-ch="paid"] { --ch: var(--c-paid); }
[data-ch="email"] { --ch: var(--c-email); }
[data-ch="organic"] { --ch: var(--c-organic); }
[data-ch="web"] { --ch: var(--c-web); }
.sw, .chdot { background: var(--ch, var(--ink-3)); }
.chdot { width: 7px; height: 7px; border-radius: 2px; flex: none; display: inline-block; }

/* ── Gantt ────────────────────────────────────────────────────────────── */
.gantt-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.gantt { flex: 1; min-height: 0; overflow: auto; position: relative; overscroll-behavior: contain; }
.g-inner { position: relative; min-width: 100%; }
.g-head { position: sticky; top: 0; z-index: 12; display: flex; background: var(--bg); border-bottom: 1px solid var(--line-2); }
.g-corner {
  position: sticky; left: 0; z-index: 13; flex: none; width: var(--lw); background: var(--bg);
  border-right: 1px solid var(--line-2); padding: 10px 14px 8px 20px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
}
.g-corner::after { content: ""; position: absolute; top: 0; bottom: 0; right: -36px; width: 36px; background: linear-gradient(to right, var(--bg) 20%, transparent); pointer-events: none; }
.g-corner .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.g-corner button { color: var(--ink-3); font: 400 10px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.g-corner button:hover { color: var(--ink); }
.g-ruler { position: relative; flex: none; }
.g-weeks { display: flex; height: 40px; }
.g-week { flex: none; border-left: 1px solid var(--line-2); padding: 8px 0 0; white-space: nowrap; position: relative; }
.g-week .wk-in { position: sticky; left: calc(var(--lw) + 10px); display: inline-block; max-width: 100%; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; }
.g-week .wd { font: 400 10px/1 var(--f-mono); letter-spacing: 0.06em; color: var(--ink-3); }
.g-week .wt { margin-top: 5px; font-family: var(--f-display); font-weight: 360; font-size: 13px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.g-week .wt.none { color: var(--ink-4); font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.04em; }
.g-week.now { background: linear-gradient(to bottom, color-mix(in srgb, var(--ink) 5%, transparent), transparent); }
.g-days { display: flex; height: 30px; }
.g-day { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 400 10px/1 var(--f-mono); color: var(--ink-3); border-left: 1px solid transparent; }
.g-day .dl { font-size: 8.5px; color: var(--ink-4); letter-spacing: 0.04em; }
.g-day.we { background: var(--weekend); }
.g-day.mon { border-left-color: var(--line-2); }
.g-day.today { color: var(--bg); }
.g-day.today .dn { background: var(--ink); color: var(--bg); border-radius: 4px; padding: 2px 3px; box-shadow: 0 0 12px color-mix(in srgb, var(--ink) 40%, transparent); }
.zoom-week .g-day .dl { display: none; }
.zoom-week .g-day { font-size: 0; }
.zoom-week .g-day.mon { font-size: 9px; }

.g-body { position: relative; }
.g-grid {
  position: absolute; top: 0; bottom: 0; left: var(--lw); pointer-events: none;
  background-image:
    linear-gradient(to right, var(--line) 0 1px, transparent 1px),
    linear-gradient(to right, transparent calc(var(--dw) * 5), var(--weekend) calc(var(--dw) * 5));
  background-size: calc(var(--dw) * 7) 100%, calc(var(--dw) * 7) 100%;
}
.g-today { position: absolute; top: 0; bottom: 0; width: 1px; z-index: 0 !important; background: linear-gradient(to bottom, var(--ink), color-mix(in srgb, var(--ink) 55%, transparent)); pointer-events: none; }
.g-todaycol { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 0; background: linear-gradient(to right, transparent, color-mix(in srgb, var(--ink) 6%, transparent) 50%, transparent); }

.g-row { display: flex; position: relative; }
.g-label {
  position: sticky; left: 0; z-index: 8; flex: none; width: var(--lw);
  background: var(--bg); border-right: 1px solid var(--line-2);
  display: flex; align-items: center; gap: 10px; padding: 0 14px 0 20px; min-width: 0;
}
.g-track { position: relative; flex: none; }

.g-row.sec { height: 42px; border-top: 1px solid var(--line-2); }
.g-row.sec:first-child { border-top: 0; }
.g-row.sec .g-label { padding-top: 6px; cursor: pointer; }
.g-row.sec .g-label .chev { color: var(--ink-3); transition: transform 200ms var(--ease); }
.g-row.sec.collapsed .chev { transform: rotate(-90deg); }
.g-row.sec .stitle { font-family: var(--f-display); font-weight: 360; font-size: 16px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.g-row.sec .tally { flex: none; }
.g-row.sec .tally { margin-left: auto; display: flex; gap: 8px; align-items: center; font: 400 10px/1 var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.tally .t-red { color: var(--red-ink); }
.tally .t-amber { color: var(--amber-ink); }
.g-row.sec .g-label:hover .stitle { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-3); }
.g-row.sub { height: 26px; }
.g-row.sub .g-label { padding-left: 46px; }
.g-row.sub .g-label .lbl { color: var(--ink-3); }

.g-row.item { height: 35px; cursor: pointer; }
.g-row.item .g-label { padding-left: 46px; }
.g-row.item:hover .g-label, .g-row.item.sel .g-label { background-color: var(--s1); }
.g-row.item:hover .g-track, .g-row.item.sel .g-track { background-color: color-mix(in srgb, var(--s1) 65%, transparent); }
.g-row.item.sel .g-label { box-shadow: inset 2px 0 0 var(--ink); }
.st { width: 15px; height: 15px; flex: none; display: grid; place-items: center; border-radius: 50%; }
.st.red { background: var(--red); color: #fff; }
.st.amber { background: var(--amber); color: #1a1205; }
.st.ready { border: 1.25px solid var(--ink-2); color: var(--ink-2); }
.st.live { background: var(--bar-live); color: var(--ink-2); }
.st.ok { border: 1.25px solid var(--line-3); }
.st.none { border: 1.25px dashed var(--line-3); }
.st.event { border: 1.25px solid var(--ink-3); border-radius: 3px; transform: rotate(45deg) scale(0.78); }
.st .i { width: 10px; height: 10px; stroke-width: 2; }
.it-name { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.it-name .nm { font-size: 13px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.it-name .meta { font: 400 9.5px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.it-name .meta .ed { color: var(--ink); border: 1px solid var(--line-3); border-radius: 3px; padding: 1px 3px; font-size: 8.5px; }
.it-post { flex: none; text-align: right; font: 400 10.5px/1.1 var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.it-post .k { display: block; font-size: 8.5px; letter-spacing: 0.06em; color: var(--ink-4); margin-bottom: 2px; }
.it-post.red { color: var(--red-ink); }
.it-post.amber { color: var(--amber-ink); }

/* marks */
.mk { position: absolute; top: 50%; }
.m-talent { height: 0; border-top: 1px dashed var(--line-3); transform: translateY(-0.5px); }
.m-brief { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border: 1.25px solid var(--ink-2); background: var(--bg); border-radius: 2px; }
.m-cap { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--ink-2); }
.m-work { height: 10px; margin-top: -5px; border-radius: 3px 0 0 3px; background: var(--fill); }
.m-review {
  height: 10px; margin-top: -5px; border-radius: 0 3px 3px 0;
  background: repeating-linear-gradient(135deg, var(--fill) 0 2px, transparent 2px 5px);
  box-shadow: inset 0 0 0 1px var(--fill);
}
.m-work.solo { border-radius: 3px 0 0 3px; }
.m-slack { height: 10px; margin-top: -5px; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--fill) 55%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--fill) 55%, transparent); background: color-mix(in srgb, var(--fill) 10%, transparent); }
.m-review.solo { border-radius: 0 3px 3px 0; }
.m-overdue { height: 0; border-top: 1.5px dashed var(--red); transform: translateY(-0.75px); opacity: 0.9; }
.m-why { transform: translateY(-50%); white-space: nowrap; font: 400 11px/1 var(--f-body); letter-spacing: 0; pointer-events: none; }
.m-why.red { color: var(--red-ink); }
.m-why.amber { color: var(--amber-ink); }
.m-why.none { color: var(--ink-4); font: 400 9.5px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.m-why .plus { color: var(--ink-4); font: 400 9.5px/1 var(--f-mono); }
.g-row.ripple .m-drift { animation: driftIn 700ms var(--ease) both; transform-origin: left center; }
.g-row.ripple .m-drift.back { transform-origin: right center; }
.g-row.ripple .m-post, .g-row.ripple .m-final { animation: settle 700ms var(--ease); }
.g-row.ripple .g-label { animation: rowFlash 1100ms var(--ease); }
@keyframes driftIn { from { transform: scaleX(0); opacity: 0; } }
@keyframes settle { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
@keyframes rowFlash { 0% { background-color: var(--s3); } 100% { background-color: var(--bg); } }
.m-final { width: 2px; height: 18px; margin: -9px 0 0 -1px; background: var(--fill); border-radius: 1px; }
.m-clear { height: 0; border-top: 1.5px dotted var(--fill); transform: translateY(-0.75px); opacity: 0.85; }
.m-post { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--fill); box-shadow: 0 0 0 2px var(--bg); }
.state-ok .m-post, .state-ready .m-post { background: radial-gradient(circle at 36% 32%, #fff 0, var(--ink) 38%, color-mix(in srgb, var(--ink) 62%, var(--bg)) 100%); box-shadow: 0 0 0 2px var(--bg), 0 2px 10px -1px color-mix(in srgb, var(--ink) 45%, transparent); }
:root[data-theme="light"] .state-ok .m-post, :root[data-theme="light"] .state-ready .m-post { background: radial-gradient(circle at 36% 32%, #6b6865 0, var(--ink) 55%); box-shadow: 0 0 0 2px var(--bg), 0 2px 6px -1px rgba(10,9,9,.35); }
.state-red .m-post { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px color-mix(in srgb, var(--red) 40%, transparent); }
.m-ghost { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 1.25px dashed var(--ghost, var(--red)); background: var(--bg); }
.m-drift { height: 1px; background: var(--ghost, var(--red)); opacity: 0.85; }
.m-drift::before { content: ""; position: absolute; right: -1px; top: -3px; width: 5px; height: 7px; background: var(--ghost, var(--red)); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.m-drift.back::before { right: auto; left: -1px; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.m-drift .dl {
  position: absolute; left: 50%; top: -15px; transform: translateX(-50%);
  font: 500 9px/1 var(--f-mono); letter-spacing: 0.04em; color: var(--ghost, var(--red-ink)); white-space: nowrap;
  background: var(--bg); padding: 2px 5px; border-radius: 3px; box-shadow: 0 0 0 2px var(--bg);
}
.m-event {
  height: 16px; margin-top: -8px; border-radius: 3px; border: 1px solid var(--ch); background: color-mix(in srgb, var(--ch) 22%, transparent);
  display: flex; align-items: center; padding: 0 6px; overflow: hidden;
  font: 400 9px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); white-space: nowrap;
}
.state-live .m-event { opacity: 0.55; }
.m-seg {
  height: 12px; margin-top: -6px; border-radius: 3px; background: var(--fill);
  overflow: hidden;
}
.m-seg.vendor { background: transparent; box-shadow: inset 0 0 0 1px var(--fill); background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--fill) 30%, transparent) 0 1px, transparent 1px 4px); }
.m-seg.qa { background: transparent; box-shadow: inset 0 0 0 1px var(--fill); background-image: repeating-linear-gradient(135deg, var(--fill) 0 2px, transparent 2px 5px); }
.m-seg.tbc { opacity: 0.55; }
.m-seg.atlas { height: 16px; margin-top: -8px; background: var(--fill); box-shadow: 0 0 0 2px var(--bg); }
.m-seg.ghost { height: 16px; margin-top: -8px; background: var(--bg); box-shadow: none; border: 1.25px dashed var(--ghost, var(--amber)); }
.m-ms { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; transform: rotate(45deg); border: 1.25px solid var(--fill); background: var(--bg); border-radius: 1.5px; }
.m-ms.goal, .m-ms.delivery { background: var(--fill); }
.m-ms.delivery { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; }
.m-feeds { font: 400 9px/1 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; transform: translateY(-50%); }
.m-hit { position: absolute; top: 0; bottom: 0; }
.g-row.item.dragging, .g-row.item.dragging * { cursor: grabbing !important; }
.m-post.drag, .m-final.drag { cursor: ew-resize; }
.m-post.drag::after, .m-final.drag::after { content: ""; position: absolute; inset: -9px -7px; }

.state-ok { --fill: var(--bar-ok); }
.state-ready { --fill: var(--bar-ok); }
.state-amber { --fill: var(--amber); }
.state-red { --fill: var(--red); }
.state-live { --fill: var(--bar-live); }
.state-none { --fill: var(--ink-4); }
.state-event { --fill: var(--ink-2); }
.state-ok .m-ghost, .state-amber .m-ghost { --ghost: var(--amber); }

.sec-dots .sd { position: absolute; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ink-3); }
.sec-dots .sd.red { background: var(--red); }
.sec-dots .sd.amber { background: var(--amber); }
.sec-dots .sd.live { background: var(--bar-live); }

.g-empty { padding: 60px 20px; text-align: center; color: var(--ink-3); }
.g-empty .disp { font-size: 22px; color: var(--ink-2); margin-bottom: 8px; }

/* legend */
.legend {
  flex: none; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 20px; border-top: 1px solid var(--line-2); background: var(--bg);
  font: 400 10px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3);
}
.legend .lg { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.legend .lg .mk { position: relative; top: auto; margin: 0 !important; transform: none; }
.legend .lg .m-work { width: 18px; border-radius: 3px; }
.legend .lg .m-slack { width: 14px; }
.legend .lg .m-review { width: 14px; }
.legend .lg .m-clear { width: 16px; }
.legend .lg .m-talent { width: 16px; }
.legend .lg .m-final { height: 14px; }
.legend .rule-note { margin-left: auto; color: var(--ink-2); text-transform: none; letter-spacing: 0; font: 400 11.5px/1.3 var(--f-body); }
.legend .rule-note b { font-weight: 500; color: var(--ink); }

/* ── Calendar ─────────────────────────────────────────────────────────── */
.cal-wrap { flex: 1; min-height: 0; overflow: auto; padding: 0 20px 20px; }
.cal-nav { display: inline-flex; align-items: center; gap: 4px; }
.cal-nav .icon-btn { width: 32px; padding: 0; }
.cal-title { font-family: var(--f-display); font-weight: 360; font-size: 30px; line-height: 0.9; text-transform: uppercase; letter-spacing: 0.01em; padding-top: 3px; min-width: 250px; }
.types { display: flex; gap: 4px; flex-wrap: wrap; }
.tchip { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px 0 9px; border-radius: 999px; border: 1px solid var(--line); font: 400 10.5px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); transition: color 160ms, border-color 160ms, background-color 160ms; }
.tchip:hover { color: var(--ink); border-color: var(--line-2); }
.tchip[aria-pressed="true"] { color: var(--ink); border-color: var(--line-3); background: var(--s2); }
.tchip .gl { width: 12px; height: 12px; display: grid; place-items: center; }

.month { border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; }
.mh { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line-2); background: var(--s1); }
.mh div { padding: 9px 12px; font: 400 10px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.mh div.we { color: var(--ink-4); }
.mw { position: relative; border-bottom: 1px solid var(--line-2); }
.mw:last-child { border-bottom: 0; }
.mw-theme { display: flex; align-items: center; gap: 10px; height: 26px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--s1); }
.mw-theme .wk { font: 400 9.5px/1 var(--f-mono); letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; }
.mw-theme .th { font-family: var(--f-display); font-weight: 360; font-size: 13px; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-2); padding-top: 1px; }
.mw-theme .cnt { margin-left: auto; font: 400 9.5px/1 var(--f-mono); letter-spacing: 0.05em; color: var(--ink-3); text-transform: uppercase; }
.mw-theme .cnt.gap { color: var(--red-ink); }
.mw.current .mw-theme .th { color: var(--ink); }
.mdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); position: relative; }
.md { cursor: default; min-height: 132px; border-left: 1px solid var(--line); padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.md:first-child { border-left: 0; }
.md.we { background: var(--weekend); }
.md.out { background: var(--weekend); }
.md.out .dn { color: var(--ink-4); }
.md .dh { display: flex; align-items: center; justify-content: space-between; height: 22px; margin-bottom: 2px; }
.md .dn { font: 400 12px/1 var(--f-mono); color: var(--ink-2); border-radius: 5px; padding: 4px 5px; margin-left: -5px; transition: background-color 160ms; }
.md .dn:hover { background: var(--s3); color: var(--ink); }
.daylist { display: none; }
.md.today .dn { background: var(--ink); color: var(--bg); box-shadow: 0 0 14px color-mix(in srgb, var(--ink) 35%, transparent); }
.md .ev-space { flex: none; }
.ev {
  display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%;
  padding: 3px 6px; border-radius: 5px; text-align: left;
  font-size: 11.5px; line-height: 1.25; color: var(--ink);
  transition: background-color 140ms;
}
.ev:hover { background: var(--s3); }
.ev .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ev .gl { flex: none; width: 10px; height: 10px; display: grid; place-items: center; }
.ev.post { background: color-mix(in srgb, var(--ch) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ch) 32%, transparent); }
.ev.post:hover { background: color-mix(in srgb, var(--ch) 24%, transparent); }
.ev.post .gl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ch); }
.ev.post.red { box-shadow: inset 0 0 0 1px var(--red); background: var(--red-wash); }
.ev.post.red .gl::before { background: var(--red); }
.ev.post.amber { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 70%, transparent); }
.ev.post.live { opacity: 0.6; }
.ev .flag { flex: none; margin-left: auto; color: var(--red-ink); display: inline-flex; }
.ev.amber .flag { color: var(--amber-ink); }
.ev.ghost { color: var(--ink-4); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--red) 70%, transparent); font-size: 11px; }
.ev.ghost .gl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1px dashed var(--red); }
.ev.ghost.fwd { text-decoration-color: var(--ink-4); }
.ev.ghost.fwd .gl::before { border-color: var(--ink-3); }
.ev.fin, .ev.cap, .ev.brief, .ev.ms { color: var(--ink-2); font-size: 11px; }
.ev.fin .gl::before { content: ""; width: 2px; height: 10px; background: var(--ink-2); border-radius: 1px; }
.ev.fin.red .gl::before { background: var(--red); }
.ev.cap .gl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.ev.brief .gl::before { content: ""; width: 7px; height: 7px; border: 1.25px solid var(--ink-3); border-radius: 1.5px; }
.ev.ms .gl::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); border: 1.25px solid var(--ch); border-radius: 1px; }
.ev.ms.goal .gl::before { background: var(--ch); }
.ev .pre { color: var(--ink-4); font: 400 9px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; flex: none; }
.more { font: 400 10px/1 var(--f-mono); letter-spacing: 0.04em; color: var(--ink-3); text-transform: uppercase; padding: 4px 6px; text-align: left; border-radius: 4px; }
.more:hover { color: var(--ink); background: var(--s3); }
.span-bar {
  position: absolute; height: 20px; border-radius: 5px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
  background: color-mix(in srgb, var(--ch) 26%, var(--bg)); border: 1px solid color-mix(in srgb, var(--ch) 65%, transparent);
  font: 400 10px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; z-index: 2;
}
.span-bar.live { opacity: 0.55; }

/* channel week */
.cw { border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; }
.cw-grid { display: grid; grid-template-columns: 150px repeat(7, minmax(0, 1fr)); }
.cw-h { padding: 10px 12px; border-bottom: 1px solid var(--line-2); background: var(--s1); border-left: 1px solid var(--line); }
.cw-h:first-child { border-left: 0; }
.cw-h .d1 { font: 400 10px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.cw-h .d2 { margin-top: 5px; font: 400 16px/1 var(--f-mono); color: var(--ink); }
.cw-h.today .d2 { display: inline-block; background: var(--ink); color: var(--bg); border-radius: 5px; padding: 3px 5px; margin-left: -5px; }
.cw-h.we { background: color-mix(in srgb, var(--s1) 70%, var(--s2)); }
.cw-lane { padding: 12px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 8px; }
.cw-lane .nm { font-family: var(--f-display); font-weight: 360; font-size: 14px; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.05; }
.cw-cell { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; min-height: 86px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cw-cell.we { background: var(--weekend); }

/* ── Activity: briefing list ──────────────────────────────────────────── */
.briefing { flex: 1; min-height: 0; overflow: auto; border-top: 1px solid var(--line); }
.bl-row { border-bottom: 1px solid var(--line); }
.bl-row.is-open { background: var(--s1); }
.bl-head { display: grid; grid-template-columns: 18px 200px minmax(0, 1fr) 300px 132px; align-items: start; gap: 18px; padding: 18px 24px 18px 20px; cursor: pointer; transition: background-color 160ms; }
.bl-head:hover { background: color-mix(in srgb, var(--s1) 70%, transparent); }
.bl-row.is-open .bl-head:hover { background: var(--s2); }
.bl-head .chev { color: var(--ink-3); padding-top: 2px; }
.bl-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bl-name h3 { margin: 0; font-family: var(--f-display); font-weight: 360; font-size: 19px; line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; padding-top: 2px; }
.state-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--line-3); }
.state-dot.blocked { background: var(--red); box-shadow: none; }
.state-dot.attention { background: var(--amber); box-shadow: none; }
.state-dot.ok { background: var(--good); box-shadow: none; }
.bl-tldr { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); position: relative; padding-right: 26px; max-width: 72ch; }
.bl-tldr .empty { color: var(--ink-3); }
.bl-tldr .stale { display: block; margin-top: 4px; font: 400 9.5px/1.3 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--amber-ink); }
.tldr-edit { position: absolute; top: -4px; right: 0; opacity: 0; }
.bl-head:hover .tldr-edit, .tldr-edit:focus-visible { opacity: 1; }
@media (hover: none) { .tldr-edit { opacity: 1; } }
.bl-meta { margin: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 1px; }
.bl-meta > div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.bl-meta dt { font: 400 9.5px/1.4 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.bl-meta dd { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bl-meta > div > * { min-width: 0; }
.bl-meta dd .mono { font-size: 11px; color: var(--ink); }

.bl-item { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto 14px; gap: 12px; align-items: center; padding: 9px 10px; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; border-radius: 0; transition: background-color 140ms; }

.bl-t { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; text-align: left; }
.bl-who { font: 400 10px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.bl-who.overdue { color: var(--red-ink); }
.bl-src { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); }

.bl-item .chev-s, .nw-row .chev-s { color: var(--ink-3); display: inline-flex; }
.bl-detail { background: var(--s2); border-radius: 0 0 8px 8px; padding: 2px 12px 14px 40px; display: flex; flex-direction: column; gap: 9px; margin-bottom: 6px; }
.bl-detail .row1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bl-detail .cd { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); max-width: 80ch; }
.bl-detail .who { display: flex; gap: 14px; flex-wrap: wrap; font: 400 10px/1.3 var(--f-mono); letter-spacing: 0.03em; color: var(--ink-3); text-transform: uppercase; }

.srcline { display: flex; align-items: center; gap: 8px; font: 400 10px/1.35 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }

.bl-foot { display: flex; align-items: center; gap: 16px; padding-top: 10px; border-top: 1px solid var(--line); }

.nw-row:hover { background: var(--s1); }

.nw-item .bl-detail { margin-bottom: 4px; }
.nw-move { display: flex; align-items: center; gap: 8px; font: 400 10px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
.nw-move select { appearance: none; -webkit-appearance: none; height: 24px; padding: 0 22px 0 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--s1); font: 400 10px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink);
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 11px) 10px, calc(100% - 7px) 10px; background-size: 4px 4px; background-repeat: no-repeat; }

.card {
  border: 1px solid var(--line-2); border-radius: var(--r-lg); background: var(--s1);
  padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px;

}

  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 999px;
  font: 400 9.5px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap;
  border: 1px solid var(--line-2); color: var(--ink-2);
}

.pill.blocked { background: var(--red); border-color: var(--red); color: #fff; }
.pill.waiting { border-color: color-mix(in srgb, var(--amber) 70%, transparent); color: var(--amber-ink); background: var(--amber-wash); }
.pill.in_progress { color: var(--ink); border-color: var(--line-3); }
.pill.todo { color: var(--ink-2); }
.pill.done { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 45%, transparent); }

.pill.change { color: var(--ink); border-color: var(--line-3); }
.card .ct { font-size: 13px; line-height: 1.35; color: var(--ink); font-weight: 450; }
.card .cd { font-size: 12px; line-height: 1.45; color: var(--ink-2); }
.card .who { display: flex; gap: 10px; flex-wrap: wrap; font: 400 10px/1.3 var(--f-mono); letter-spacing: 0.03em; color: var(--ink-3); text-transform: uppercase; }
.card .who b { font-weight: 400; color: var(--ink-2); }
.card .impact { font-size: 11.5px; line-height: 1.4; color: var(--ink-2); display: flex; gap: 6px; }
.card .impact .i { margin-top: 1px; color: var(--ink-3); width: 13px; height: 13px; }
.card .linked { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink); text-align: left; }
.card .linked .i { color: var(--ink-3); width: 12px; height: 12px; }
.card .linked:hover span { text-decoration: underline; text-underline-offset: 3px; }
.src { display: flex; align-items: center; gap: 6px; font: 400 9.5px/1.3 var(--f-mono); letter-spacing: 0.03em; color: var(--ink-3); text-transform: uppercase; min-width: 0; }
.src .i { width: 12px; height: 12px; flex: none; }

.mini { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); transition: color 140ms, background-color 140ms; }

}

/* inline add form */

/* ── Drawer ───────────────────────────────────────────────────────────── */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(480px, 100vw);
  background: var(--s1); border-left: 1px solid var(--line-2); box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column;
  transform: translateX(104%); transition: transform 280ms var(--ease), visibility 0s 280ms; visibility: hidden;
}
.drawer.open { transform: none; visibility: visible; transition: transform 280ms var(--ease); }
.dr-h { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.dr-h .crumbs { display: flex; align-items: flex-start; gap: 8px; }
.dr-h .crumbs h2 { flex: 1; }
.dr-h h2 { margin: 0; font-size: 21px; font-weight: 450; line-height: 1.2; letter-spacing: -0.01em; }
.dr-h .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.dr-b { flex: 1; overflow: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 22px; }
.dr-b h3 { margin: 0 0 10px; font: 400 10px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.dr-b h3 .grow { flex: 1; height: 1px; background: var(--line); }
.verdict { border-radius: var(--r-lg); padding: 12px 14px; display: flex; gap: 11px; align-items: flex-start; border: 1px solid var(--line-2); }
.verdict .st { margin-top: 1px; width: 18px; height: 18px; }
.verdict .st .i { width: 12px; height: 12px; }
.verdict.red { background: var(--red-wash); border-color: color-mix(in srgb, var(--red) 55%, transparent); }
.verdict.amber { background: var(--amber-wash); border-color: color-mix(in srgb, var(--amber) 50%, transparent); }
.verdict .vt { font-size: 13.5px; line-height: 1.35; font-weight: 500; }
.verdict ul { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.verdict li { font-size: 12.5px; line-height: 1.4; color: var(--ink-2); display: flex; gap: 7px; }
.verdict li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ink-3); }
.verdict li.red::before { background: var(--red); }
.verdict li.amber::before { background: var(--amber); }

.chain { position: relative; display: flex; flex-direction: column; }
.chain::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 1px; background: var(--line-2); }
.cs { position: relative; display: grid; grid-template-columns: 15px 1fr auto; gap: 12px; align-items: center; padding: 7px 0; }
.cs .node { width: 15px; height: 15px; display: grid; place-items: center; position: relative; z-index: 1; background: var(--s1); }
.cs .node i { display: block; }
.cs .node .n-brief { width: 9px; height: 9px; border: 1.25px solid var(--ink-2); border-radius: 2px; }
.cs .node .n-cap { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-2); }
.cs .node .n-work { width: 11px; height: 6px; border-radius: 2px; background: var(--fill); }
.cs .node .n-review { width: 11px; height: 6px; border-radius: 2px; background: repeating-linear-gradient(135deg, var(--fill) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--fill); }
.cs .node .n-final { width: 2px; height: 12px; background: var(--fill); }
.cs .node .n-clear { width: 11px; border-top: 1.5px dotted var(--fill); }
.cs .node .n-post { width: 11px; height: 11px; border-radius: 50%; background: var(--fill); }
.state-ok .cs .node .n-post, .state-ready .cs .node .n-post { background: var(--ink); box-shadow: var(--orb-glow); }
.cs .k { font-size: 13px; color: var(--ink); line-height: 1.25; }
.cs .k small { display: block; font: 400 10px/1.3 var(--f-mono); letter-spacing: 0.03em; color: var(--ink-3); text-transform: uppercase; margin-top: 2px; }
.cs .k small.red { color: var(--red-ink); }
.cs .k small.amber { color: var(--amber-ink); }
.cs .v { display: flex; align-items: center; gap: 6px; }
.dateinp {
  height: 30px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink);
  font: 400 11.5px/1 var(--f-mono); padding: 0 8px; width: 132px; outline: none; transition: border-color 160ms;
}
.dateinp:hover { border-color: var(--line-3); }
.dateinp:focus { border-color: var(--ink-3); }
.dateinp.changed { border-color: var(--ink); }
.numinp { width: 56px; }
.ro { font: 400 11.5px/1 var(--f-mono); color: var(--ink-2); padding: 0 8px; }
.ro.red { color: var(--red-ink); }
.notes { font-size: 13px; line-height: 1.55; color: var(--ink-2); white-space: pre-line; }
.ms-list { display: flex; flex-direction: column; }
.ms-row { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.ms-row:first-child { border-top: 0; }
.ms-row .d { font: 400 10.5px/1.3 var(--f-mono); color: var(--ink-3); text-transform: uppercase; }
.ms-row .d.today { color: var(--ink); }
.ms-row .d.past { color: var(--ink-4); }
.ms-row .tx { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
.ms-row .tx b { font: 400 9.5px/1 var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--line-2); border-radius: 3px; padding: 2px 4px; margin-right: 6px; }
.ms-row.atlas .tx b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dr-f { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 8px; align-items: center; }
.dr-f .src { flex: 1; }
.dr-f .btn { flex: none; padding: 0 14px; }

/* ── Tooltip, popover, toast ──────────────────────────────────────────── */
.tip {
  position: fixed; z-index: 90; pointer-events: none; max-width: 300px;
  background: var(--s2); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow-pop);
  padding: 8px 10px; font-size: 12px; line-height: 1.4; color: var(--ink);
  opacity: 0; transform: translateY(3px); transition: opacity 120ms, transform 120ms;
}
.tip.on { opacity: 1; transform: none; }
.tip .tk { font: 400 9.5px/1.2 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.tip .tr { color: var(--red-ink); }
.tip .ta { color: var(--amber-ink); }

.pop {
  position: fixed; z-index: 70; width: 340px; max-height: min(520px, 80vh); overflow: auto;
  background: var(--s2); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-pop);
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.pop[hidden] { display: none; }

/* Atlas Marketing HQ: one rules engine feeding three views (Timeline, Calendar, Activity). */
(() => {
  'use strict';

  let DATA = window.HQ_DATA;
  let ACT = window.HQ_ACTIVITY;
  // owner = Private view (sources, queue, private cards). team = Team view, which never receives them.
  const OWNER = window.HQ_MODE !== 'team';
  // LIVE = the published page (live.js): data and shared edits come from Supabase, and access from the user list.
  const LIVE = window.HQ_LIVE || null;
  const SHELL = (() => { const b = document.body.cloneNode(true); b.querySelectorAll('script').forEach(n => n.remove()); return b.innerHTML; })();
  const TEAM_FIELDS = ['id', 'cat', 'kind', 'status', 'title', 'detail', 'impact', 'owner', 'wait', 'due', 'links', 'oldDate', 'newDate', 'date'];

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plural = (n, w, p = w + 's') => `${n} ${n === 1 ? w : p}`;

  // ── Dates: whole UTC days since epoch ──────────────────────────────────
  const DAY = 864e5;
  const dn = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };

  const ud = k => new Date(k * DAY);
  const _now = new Date();
  const TODAY = Math.round(Date.UTC(_now.getFullYear(), _now.getMonth(), _now.getDate()) / DAY);
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const dow = k => (ud(k).getUTCDay() + 6) % 7;
  const mondayOf = k => k - dow(k);
  const f = k => (k == null ? '—' : `${MON[ud(k).getUTCMonth()]} ${ud(k).getUTCDate()}`);
  const fw = k => (k == null ? '—' : `${WD[dow(k)]} ${f(k)}`);
  const rel = k => { const d = k - TODAY; return d === 0 ? 'today' : d === 1 ? 'tomorrow' : d === -1 ? 'yesterday' : d > 0 ? `in ${d} days` : `${-d} days ago`; };
  const isoWeek = k => { const d = ud(k); const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7))); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 4)); return 1 + Math.round(((t - y) / DAY - 3 + ((y.getUTCDay() + 6) % 7)) / 7); };
