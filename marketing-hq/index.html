    if ((el = t.closest('[data-ch-toggle]'))) { const c = el.dataset.chToggle; S.openCh[c] = !S.openCh[c]; save('openCh'); return renderActivity(); }
    if (t.closest('[data-ch-all]')) { const any = DATA.channels.some(c => S.openCh[c.id]); S.openCh = any ? {} : Object.fromEntries(DATA.channels.map(c => [c.id, true])); save('openCh'); return renderActivity(); }
    if ((el = t.closest('[data-done-toggle]'))) { const c = el.dataset.doneToggle; S.showDone[c] = !S.showDone[c]; return renderActivity(); }
    if (t.closest('[data-show-new]')) {
      ACTS.filter(a => a.state === 'pending').forEach(a => { S.openCh[a.cat] = true; }); save('openCh'); renderActivity();
      const first = $('.nw'); return first && first.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    if ((el = t.closest('[data-show-denied]'))) return deniedPop(el);
    if ((el = t.closest('[data-theme-set]'))) {
      document.documentElement.setAttribute('data-theme', el.dataset.themeSet);
      store.set('theme', el.dataset.themeSet);
      return renderChrome();
    }
    if (t.closest('#btn-rules')) return pop.hidden ? rulesPop($('#btn-rules')) : closePop();
    if ((el = t.closest('[data-focus]'))) {
      S.focus = S.focus === el.dataset.focus ? null : el.dataset.focus;
      if (S.focus === 'waiting' && S.view !== 'activity') { S.view = 'activity'; save('view'); }
      return refresh();
    }
    if ((el = t.closest('[data-chf]'))) {
      const c = el.dataset.chf;
      S.ch.has(c) ? S.ch.delete(c) : S.ch.add(c);
      return refresh();
    }
    if (t.closest('[data-clear-filters]')) { S.q = ''; S.ch.clear(); S.focus = null; S.hideLive = false; save('hideLive'); return refresh(); }
    if ((el = t.closest('[data-zoom]'))) { S.zoom = el.dataset.zoom; save('zoom'); renderTimelineToolbar(); renderGantt(false); return scrollGanttToToday(false); }
    if (t.closest('[data-hide-live]')) { S.hideLive = !S.hideLive; save('hideLive'); return refresh(); }
    if (t.closest('[data-today]')) return scrollGanttToToday(true);
    if (t.closest('[data-collapse-all]')) {
      const any = Object.values(S.collapsed).some(Boolean);
      S.collapsed = any ? {} : Object.fromEntries(DATA.sections.map(s => [s.id, true]));
      save('collapsed'); return renderGantt();
    }
    if ((el = t.closest('[data-sec]'))) { S.collapsed[el.dataset.sec] = !S.collapsed[el.dataset.sec]; save('collapsed'); return renderGantt(); }
    if ((el = t.closest('[data-open]'))) { closePop(); return openDrawer(el.dataset.open); }
    if ((el = t.closest('.g-row.item')) && !justDragged) return openDrawer(el.dataset.id);
    if (t.closest('[data-close]') || t.closest('#scrim')) return closeDrawer();
    if ((el = t.closest('[data-reset]'))) { delete S.overrides[el.dataset.reset]; save('overrides'); toast('Edits reset to the sheet'); return refresh(); }
    if ((el = t.closest('[data-live]'))) { const id = el.dataset.live; setOverride(id, 'status', 'live'); refresh(); return toast('Marked live', () => { setOverride(id, 'status', BYID[id].status ?? ''); refresh(); }); }
    // calendar
    if ((el = t.closest('[data-cal-step]'))) {
      const d = +el.dataset.calStep;
      if (S.cal.mode === 'month') { const m = ud(S.cal.month); S.cal.month = dn(new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + d, 1)).toISOString().slice(0, 10)); }
      else S.cal.week += 7 * d;
      return renderCalendar();
    }
    if (t.closest('[data-cal-today]')) { const d = ud(TODAY); S.cal.month = dn(`${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-01`); S.cal.week = mondayOf(TODAY); return renderCalendar(); }
    if ((el = t.closest('[data-cal-mode]'))) { S.cal.mode = el.dataset.calMode; store.set('calMode', S.cal.mode); return renderCalendar(); }
    if ((el = t.closest('[data-ctype]'))) { const c = el.dataset.ctype; S.cal.types.has(c) ? S.cal.types.delete(c) : S.cal.types.add(c); store.set('calTypes', [...S.cal.types]); return renderCalendar(); }
    if ((el = t.closest('[data-day]'))) {
      if (matchMedia('(max-width: 640px)').matches) { S.cal.sel = +el.dataset.day; renderCalendar(); const dl = $('.daylist'); return dl && dl.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      return dayPop(el.matches('.md') ? el.querySelector('.dn') : el, +el.dataset.day);
    }
    // activity
    if ((el = t.closest('[data-actf]'))) { S.actFilter = el.dataset.actf; if (S.focus === 'waiting') { S.focus = null; renderPulse(); } return renderActivity(); }
    if ((el = t.closest('[data-undeny]'))) { delete S.decisions[el.dataset.undeny]; save('decisions'); closePop(); return refresh(); }
    if ((el = t.closest('[data-status-menu]'))) return statusMenu(el, el.dataset.statusMenu);
    if ((el = t.closest('[data-set-status]'))) { const id = el.dataset.setStatus; const old = ACTS.find(a => a.id === id).status; setAct(id, { status: el.dataset.v }); closePop(); refresh(); return toast(`Status set to ${STATUS_LABEL[el.dataset.v]}`, () => { setAct(id, { status: old }); refresh(); }); }
    if ((el = t.closest('[data-done]'))) {
      const id = el.dataset.done; const a = ACTS.find(x => x.id === id); const old = a.status;
      setAct(id, { status: old === 'done' ? (a.prevStatus || 'todo') : 'done', prevStatus: old });
      refresh();
      return toast(old === 'done' ? 'Reopened' : 'Marked done', () => { setAct(id, { status: old }); refresh(); });
    }
    if ((el = t.closest('[data-remove]'))) { const id = el.dataset.remove; setAct(id, { removed: true }); refresh(); return toast('Removed', () => { setAct(id, { removed: false }); refresh(); }); }
    if ((el = t.closest('[data-add]'))) { S.addingIn = S.addingIn === el.dataset.add ? null : el.dataset.add; S.openCh[el.dataset.add] = true; renderActivity(); const inp = $(`[data-add-form] input[name=title]`); if (inp) inp.focus(); return; }
    if (t.closest('[data-add-cancel]')) { S.addingIn = null; return renderActivity(); }
    if (t.closest('[data-tldr-cancel]')) { S.editingTldr = null; return renderActivity(); }
    if (t.closest('[data-export]')) return exportData();
    if (t.closest('[data-rules-reset]')) { S.rules = { ...DATA.rules }; store.set('rules', {}); closePop(); refresh(); return toast('Rules back to defaults'); }
    if (t.closest('[data-wipe]') && !LIVE) {
      ['overrides', 'decisions', 'catEdits', 'actEdits', 'added', 'rules'].forEach(k => store.set(k, k === 'added' ? [] : {}));
      S.overrides = {}; S.decisions = {}; S.catEdits = {}; S.actEdits = {}; S.added = []; S.rules = { ...DATA.rules };
      closePop(); refresh(); return toast('Local edits cleared');
    }
    if (!pop.hidden && !t.closest('#pop')) closePop();
  });

  document.addEventListener('submit', e => {
    const tf = e.target.closest('[data-tldr-form]');
    if (tf) {
      e.preventDefault();
      const ch = tf.dataset.tldrForm;
      const prev = S.tldr[ch];
      const fd = new FormData(tf);
      S.tldr[ch] = { text: fd.get('text').trim(), state: fd.get('state'), updated: ds(TODAY) };
      save('tldr'); S.editingTldr = null; renderActivity();
      return toast(`${CH[ch].name} TL;DR updated`, () => { if (prev) S.tldr[ch] = prev; else delete S.tldr[ch]; save('tldr'); renderActivity(); });
    }
    const form = e.target.closest('[data-add-form]');
    if (!form) return;
    e.preventDefault();
    const fd = new FormData(form);
    const item = {
      id: 'm-' + Date.now().toString(36), cat: form.dataset.addForm, kind: 'action',
      title: fd.get('title').trim(), status: fd.get('status'), owner: fd.get('owner').trim() || 'Zoe',
      wait: fd.get('wait').trim() || null, due: fd.get('due') || null, links: fd.get('link') ? [fd.get('link')] : [], vis: fd.get('vis') || 'team', date: ds(TODAY),
      src: { type: 'manual', ref: 'Added in Marketing HQ', date: ds(TODAY) }
    };
    if (!item.title) return;
    S.added.push(item); save('added');
    S.addingIn = null; S.openCh[item.cat] = true; save('openCh');
    refresh();
    toast(`Added to ${CH[item.cat].name}`);
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-edit]') && S.sel) {
      const v = t.type === 'number' ? (t.value ? +t.value : '') : t.value;
      setOverride(S.sel, t.dataset.edit, v);
      return ripple(S.sel);
    }
    if (t.matches('[data-q-cat]')) { S.catEdits[t.dataset.qCat] = t.value; save('catEdits'); S.openCh[t.value] = true; save('openCh'); refresh(); return toast(`Moved to ${CH[t.value].name}`); }
    if (t.matches('[data-rule]')) {
      const v = Math.max(+t.min, Math.min(+t.max, +t.value || 0));
      S.rules[t.dataset.rule] = v;
      store.set('rules', Object.fromEntries(Object.entries(S.rules).filter(([k, val]) => DATA.rules[k] !== val)));
      return refresh();
    }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('#q-timeline, #q-calendar, #q-activity')) {
      S.q = t.value;
      const id = t.id, pos = t.selectionStart;
      compute(); renderPulse();
      if (S.view === 'timeline') renderGantt(); else renderView();
      const n = $('#' + id); if (n && document.activeElement !== n) { n.focus(); n.setSelectionRange(pos, pos); }
    }
  });

  document.addEventListener('keydown', e => {
    const typing = e.target.closest('input, textarea, select, [contenteditable]');
    if (e.key === 'Escape') {
      if (!pop.hidden) return closePop();
      if (S.sel) return closeDrawer();
      if (typing && typing.type === 'search' && typing.value) { typing.value = ''; typing.dispatchEvent(new Event('input', { bubbles: true })); }
      return;
    }
    if (typing) return;
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.g-label[role=button]')) {
      e.preventDefault();
      const sec = e.target.dataset.sec;
      if (sec) { S.collapsed[sec] = !S.collapsed[sec]; save('collapsed'); renderGantt(); const n = $(`[data-sec="${sec}"]`); n && n.focus(); return; }
      return openDrawer(e.target.closest('.g-row').dataset.id);
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-ch-toggle], .bl-item[data-item-toggle]')) { e.preventDefault(); return e.target.click(); }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '1') return setView('activity');
    if (e.key === '2') return setView('timeline');
    if (e.key === '3') return setView('calendar');
    if (e.key === '/') { e.preventDefault(); const s = $(`#q-${S.view}`); return s && s.focus(); }
    if (e.key === 't' && S.view === 'timeline') return scrollGanttToToday(true);
  });

  $$('.tabs .tab').forEach((tab, i, all) => tab.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const n = all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length];
    n.focus(); setView(n.dataset.view);
  }));

  // ── Drag to reschedule (post dot, final notch, production block) ───────
  let dragging = null;
  let justDragged = false;
  $('#gantt').addEventListener('pointerdown', e => {
    const h = e.target.closest('[data-drag]');
    if (!h || e.button !== 0 || !CAN_EDIT()) return;
    const row = h.closest('.g-row.item');
    const id = row.dataset.id;
    const r = R[id];
    if (r.status === 'live' || r.feeds && h.dataset.drag !== 'post' && h.dataset.drag !== 'fin') return;
    e.preventDefault();
    const field = h.dataset.drag;
    const snap = { ...(S.overrides[id] || {}) };
    const hadOverride = id in S.overrides;
    dragging = { id, field, x0: e.clientX, delta: 0, snap, hadOverride, orig: { post: r.post, fin: r.fin, cap: r.cap, brief: r.brief } };
    tip.classList.remove('on'); tipEl = null;
    try { $('#gantt').setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
    row.classList.add('dragging');
  });
  $('#gantt').addEventListener('pointermove', e => {
    if (!dragging) return;
    const dw = S.zoom === 'day' ? 34 : 13;
    const delta = Math.round((e.clientX - dragging.x0) / dw);
    if (delta === dragging.delta) return;
    dragging.delta = delta;
    const { id, field, orig } = dragging;
    const shift = v => (v ? ds(dn(v) + delta) : v);
    S.overrides[id] = { ...dragging.snap };
    if (field === 'post') S.overrides[id].post = shift(orig.post);
    else if (field === 'fin') S.overrides[id].fin = shift(orig.fin);
    else { ['fin', 'cap', 'brief'].forEach(k => { if (orig[k]) S.overrides[id][k] = shift(orig[k]); }); }
    compute();
    renderGantt();
    renderPulse();
    const row = $(`.g-row.item[data-id="${id}"]`);
    if (row) row.classList.add('dragging');
    const r = R[id];
    const target = field === 'post' ? r.a.g.post : r.a.g.fin;
    tip.innerHTML = `<div class="tk">${field === 'post' ? 'Post' : field === 'fin' ? 'Final asset due' : 'Production'} ${delta > 0 ? '+' : ''}${delta}d</div><div class="${r.a.state === 'red' ? 'tr' : r.a.state === 'amber' ? 'ta' : ''}">${fw(target)} · ${STATE_WORD[r.a.state]}</div>`;
    tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 16) + 'px';
    tip.classList.add('on');
  });
  const endDrag = e => {
    if (!dragging) return;
    const { id, delta, snap, hadOverride, field } = dragging;
    dragging = null;
    tip.classList.remove('on');
    if (!delta) {
      if (hadOverride) S.overrides[id] = snap; else delete S.overrides[id];
      $$('.g-row.dragging').forEach(r => r.classList.remove('dragging'));
      return;
    }
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    // normalise: drop fields equal to the sheet
    const o = S.overrides[id];
    Object.keys(o).forEach(k => { if (String(o[k]) === String(BYID[id][k])) delete o[k]; });
    if (!Object.keys(o).length) delete S.overrides[id];
    save('overrides');
    ripple(id);
    const r = R[id];
    toast(`${r.t}: ${field === 'post' ? 'post' : field === 'fin' ? 'final asset' : 'production'} moved ${delta > 0 ? '+' : ''}${delta}d. ${STATE_WORD[r.a.state]}.`, () => {
      if (hadOverride) S.overrides[id] = snap; else delete S.overrides[id];
      save('overrides'); refresh();
    });
  };
  $('#gantt').addEventListener('pointerup', endDrag);
  $('#gantt').addEventListener('pointercancel', endDrag);

  // ── Share: the team file ───────────────────────────────────────────────
  function teamPayload() {
    const data = JSON.parse(JSON.stringify(DATA));
    data.items = data.items.map(it => {
      const m = { ...it, ...(S.overrides[it.id] || {}) };

      return m;

    data.status = { ...(DATA.status || {}) };
    Object.entries(S.tldr).forEach(([k, v]) => { data.status[k] = v; });
    const items = activity().filter(a => (a.state === 'approved' || a.state === 'completed') && a.vis === 'team').map(a => {
      const t = {};
      TEAM_FIELDS.forEach(k => { if (a[k] != null) t[k] = a[k]; });
      if (!t.date && a.src && a.src.date) t.date = a.src.date;
      return t;
    });
    return { data, act: { version: ACT.version, updated: ds(TODAY), items, queue: [], scans: [], notes: {} } };
  }
  // Live page: Team view reads only this sanitised snapshot, so every Private-view edit republishes it.
  let teamT = null;
  function publishTeamSoon(delay = 1500) {
    if (!LIVE || !OWNER) return;
    clearTimeout(teamT);
    teamT = setTimeout(() => LIVE.publishTeam(teamPayload()), delay);
  }
  function shareTeamFile() {
    const { data, act } = teamPayload();
    const j = o => JSON.stringify(o).replace(/</g, '\\u003c');
    const app = $('#hq-app') ? $('#hq-app').textContent : '';
    if (!app) return toast('Open the built file to share a team copy');
    const html = `<!doctype html>\n<html lang="en" data-theme="dark">\n<head>${document.head.innerHTML}</head>\n<body>${SHELL}\n<script>window.HQ_MODE = 'team';<\/script>\n<script>window.HQ_DATA = ${j(data)};<\/script>\n<script>window.HQ_ACTIVITY = ${j(act)};<\/script>\n<script id="hq-app">${app}<\/script>\n</body>\n</html>\n`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = `Marketing HQ (team) ${ds(TODAY)}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(`Team file downloaded: ${plural(act.items.length, 'card')}, no sources or private cards`);
  }

  // ── Export ─────────────────────────────────────────────────────────────
  function exportData() {
    const payload = {
      exported: new Date().toISOString(),
      rules: S.rules,
      items: Object.values(R).map(r => ({ id: r.id, section: SEC[r.sec].name, subsection: r.sub || null, title: r.t, channel: r.ch, kind: r.kind || 'content', status: r.status || null, talent: r.who || null, vendor: r.vendor || null, brief: r.brief || null, capture: r.cap || null, work_days: r.work || null, final_due: r.fin || null, post: r.post || null, planned_post: r.plan && r.plan.post || null, state: r.a.state, flags: r.a.flags.map(x => x.t), notes: r.notes || null, edited: r.edited })),
      activity: ACTS.map(a => ({ id: a.id, category: a.cat, kind: a.kind, title: a.title, status: a.status, owner: a.owner || null, waiting_on: a.wait || null, due: a.due || null, impact: a.impact || null, links: a.links || [], visibility: a.vis, decision: a.state, ...(PRIV() ? { source: a.src || null } : {}) }))
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `atlas-marketing-hq-${ds(TODAY)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Exported a JSON snapshot');
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  const VIEWS = ['activity', 'timeline', 'calendar'];
  const [hv, hid] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (VIEWS.includes(hv)) S.view = hv;
  if (!VIEWS.includes(S.view)) S.view = 'activity';
  refresh();
  if (hid && R[hid]) openDrawer(hid);
  if (S.view === 'timeline') requestAnimationFrame(() => scrollGanttToToday(false));
  window.addEventListener('resize', () => { closePop(); });

  // ── Live: changes made by other people arrive here ────────────────────
  if (LIVE) {
    let pendingRemote = false;
    const busy = () => !!dragging || !!(document.activeElement && document.activeElement.closest &&
      document.activeElement.closest('main input:not([type=search]), main textarea, main select, #drawer input, #drawer textarea, #drawer select, #pop input, #pop select'));
    const remoteRefresh = () => {
      if (busy()) { pendingRemote = true; return; }
      pendingRemote = false;
      if (S.sel && !R[S.sel] && !BYID[S.sel]) closeDrawer();
      refresh();
    };
    document.addEventListener('focusout', () => { if (pendingRemote) setTimeout(remoteRefresh, 0); });
    LIVE.connect({
      shared(k, v) {
        if (k === 'rules') S.rules = { ...DATA.rules, ...(v || {}) };
        else S[k] = v == null ? (k === 'added' ? [] : {}) : v;
        remoteRefresh();
      },
      rebind(data, act) {
        bind(data, act);
        S.rules = { ...DATA.rules, ...store.get('rules', {}) };
        if (S.sel && !BYID[S.sel]) closeDrawer();
        remoteRefresh();
        publishTeamSoon();
      },
      publishTeamNow: () => LIVE.publishTeam(teamPayload(), true),
      exportData, toast, ic, esc, plural
    });
    publishTeamSoon(800);   // keeps Team view current after new data from a build, or a new day
  }
})();

const sb = createClient(CFG.url, CFG.key);
const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const j = v => JSON.stringify(v ?? null);
const clone = v => (v == null ? v : JSON.parse(JSON.stringify(v)));
const day = iso => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const when = iso => `${day(iso)}, ${new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
const session = { get: k => { try { return sessionStorage.getItem('hq:' + k); } catch (e) { return null; } },
                  set: (k, v) => { try { v == null ? sessionStorage.removeItem('hq:' + k) : sessionStorage.setItem('hq:' + k, v); } catch (e) { /* private mode */ } } };

let me = null;            // { email, name, role, view } from hq_whoami()
let app = null;           // hooks app.js hands over through LIVE.connect()
let rows = {};            // hq_state rows by key
const shared = {};        // Private view: the edit sets, by name
const timers = {};        // pending saves, by edit-set name
const lastSaved = {};     // JSON of what this tab last wrote or loaded, by hq_state key
let inflight = 0;
let teamJSON = null;      // the Team view snapshot as last written or loaded

// ── Sign-in screen ──────────────────────────────────────────────────────
const gate = document.createElement('div');
gate.className = 'gate';
gate.id = 'gate';
document.body.append(gate);

const BRAND = '<div class="brand"><span class="mark" aria-label="Atlas">ATLAS</span><span class="rule" aria-hidden="true"></span><span class="name">Marketing HQ</span></div>';
let cooldownT = null;

function screen(kind, o = {}) {
  clearInterval(cooldownT);
  document.body.classList.add('locked');
  gate.hidden = false;
  const card = (title, text, rest = '') => {
    gate.innerHTML = `<div class="gate-card">${BRAND}<h1 class="gate-title">${title}</h1>${text ? `<p class="gate-text">${text}</p>` : ''}${rest}</div>`;
  };

  if (kind === 'loading') {
    gate.innerHTML = `<div class="gate-card">${BRAND}<p class="gate-wait"><span class="pip"></span>${esc(o.text || 'Opening Marketing HQ')}</p></div>`;
    return;
  }

  if (kind === 'email') {
    card('Sign in', 'Marketing HQ is shared by invitation. Enter the email address your invitation went to, and we\'ll email you a sign-in code.', `
      <form class="gate-form" data-gate="email" novalidate>
        <label class="sr" for="gate-email">Email address</label>
        <input id="gate-email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="${esc(o.email || '')}" required>
        <button class="btn primary" type="submit">Email me a code</button>
        <p class="gate-msg" role="status" aria-live="polite"></p>
      </form>`);
    const input = gate.querySelector('#gate-email');
    setTimeout(() => { input.focus(); if (input.value) input.select(); }, 0);
    return;
  }

  if (kind === 'code') {
    card('Check your email', `We sent a sign-in code to <b>${esc(o.email)}</b>. It can take a minute to arrive.`, `
      <form class="gate-form" data-gate="code" novalidate>
        <label class="sr" for="gate-code">Sign-in code</label>
        <input id="gate-code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••" required>
        <button class="btn primary" type="submit">Sign in</button>
        <p class="gate-msg" role="status" aria-live="polite"></p>
      </form>
      <div class="gate-links"><button type="button" data-gate-resend>Send a new code</button><button type="button" data-gate-back>Use a different email</button></div>
      <p class="gate-note">Nothing after a few minutes? Check your spam folder. If it still isn't there, ask the person who invited you to check they shared Marketing HQ with this address.</p>`);
    gate.dataset.email = o.email;
    setTimeout(() => gate.querySelector('#gate-code').focus(), 0);
    cooldown(o.sentAt || Date.now());
    return;
  }

  if (kind === 'denied') {
    card('No access', `You're signed in as <b>${esc(o.email)}</b>, but Marketing HQ hasn't been shared with that address. Ask the person who invited you to share it with this email.`,
      '<div class="gate-form"><button class="btn" type="button" data-gate-signout>Sign in with a different email</button></div>');
    return;
  }

  if (kind === 'switch') {
    card('Different account', `This invitation is for <b>${esc(o.invite)}</b>, but this browser is signed in as <b>${esc(o.email)}</b>.`, `
      <div class="gate-form">
        <button class="btn primary" type="button" data-gate-signout data-then="${esc(o.invite)}">Sign in as ${esc(o.invite)}</button>
        <button class="btn" type="button" data-gate-continue>Continue as ${esc(o.email)}</button>
      </div>`);
    return;
  }

  card(esc(o.title || 'Something went wrong'), esc(o.text || ''), '<div class="gate-form"><button class="btn" type="button" data-gate-retry>Try again</button></div>');
}

function cooldown(sentAt) {
  const btn = gate.querySelector('[data-gate-resend]');
  if (!btn) return;
  const tick = () => {
    const left = RESEND_SECONDS - Math.floor((Date.now() - sentAt) / 1000);
    btn.disabled = left > 0;
    btn.textContent = left > 0 ? `Send a new code (${left}s)` : 'Send a new code';
    if (left <= 0) clearInterval(cooldownT);
  };
  tick();
  cooldownT = setInterval(tick, 1000);
}

async function invoke(action, body = {}) {
  const { data, error } = await sb.functions.invoke(CFG.fn, { body: { action, ...body } });
  if (!error) return data || { ok: true };
  try { return await error.context.json(); } catch (e) { return { ok: false, error: 'Could not reach Marketing HQ. Check your connection and try again.' }; }
}

async function requestCode(email, msgEl, btn) {
  email = email.trim().toLowerCase();
  if (!EMAIL.test(email)) { msgEl.textContent = 'Enter your full email address.'; return; }
  if (btn) btn.disabled = true;
  msgEl.className = 'gate-msg quiet';
  msgEl.textContent = 'Sending...';
  const r = await invoke('request-code', { email });
  if (btn) btn.disabled = false;
  if (!r.ok) { msgEl.className = 'gate-msg'; msgEl.textContent = r.error || 'The code could not be sent. Try again in a minute.'; return; }
  const sentAt = Date.now();
  session.set('email', email);
  session.set('sentAt', String(sentAt));
  screen('code', { email, sentAt });
}

gate.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  const msg = form.querySelector('.gate-msg');
  const btn = form.querySelector('button[type=submit]');
  if (form.dataset.gate === 'email') return requestCode(form.querySelector('input').value, msg, btn);
  if (form.dataset.gate === 'code') {
    const token = form.querySelector('input').value.replace(/\D/g, '');
    if (token.length < 6) { msg.className = 'gate-msg'; msg.textContent = 'Enter the code from the email.'; return; }
    btn.disabled = true;
    msg.className = 'gate-msg quiet';
    msg.textContent = 'Checking...';
    const { error } = await sb.auth.verifyOtp({ email: gate.dataset.email, token, type: 'email' });
    btn.disabled = false;
    if (error) {
      msg.className = 'gate-msg';
      msg.textContent = /expired|invalid/i.test(error.message)
        ? 'That code didn\'t work. It may have expired or been mistyped. Check it, or send a new code.'
        : error.message;
      return;
    }
    session.set('email', null);
    session.set('sentAt', null);
    start();
  }
});

gate.addEventListener('click', async e => {
  const t = e.target;
  if (t.closest('[data-gate-back]')) { session.set('sentAt', null); return screen('email', { email: gate.dataset.email }); }
  if (t.closest('[data-gate-resend]')) {
    const msg = gate.querySelector('.gate-msg');
    return requestCode(gate.dataset.email, msg, t.closest('button'));
  }
  if (t.closest('[data-gate-retry]')) return start();
  if (t.closest('[data-gate-continue]')) { invite = null; return start(); }
  const so = t.closest('[data-gate-signout]');
  if (so) {
    await sb.auth.signOut();
    invite = null;
    return screen('email', { email: so.dataset.then || '' });
  }
});

// ── Boot ────────────────────────────────────────────────────────────────
// Invitation links end in #invite=<their email>. The fragment never reaches a server; we read it and remove it.
let invite = (() => {
  const m = location.hash.match(/^#invite=([^&]+)/);
  if (!m) return null;
  history.replaceState(null, '', location.pathname + location.search);
  try { return decodeURIComponent(m[1]).trim().toLowerCase(); } catch (e) { return null; }
})();

class Problem extends Error { constructor(title, text) { super(title); this.title = title; this.text = text; } }

let started = false;
async function start() {
  if (started) return;
  screen('loading');
  const { data: { session: s } } = await sb.auth.getSession();
  if (!s) {
    const pending = session.get('email');
    const sentAt = Number(session.get('sentAt')) || 0;
    if (pending && !invite && Date.now() - sentAt < 60 * 60 * 1000) return screen('code', { email: pending, sentAt });
    return screen('email', { email: invite || pending || '' });
  }
  const email = (s.user.email || '').toLowerCase();
  if (invite && invite !== email) return screen('switch', { invite, email });
  try {
    const { data, error } = await sb.rpc('hq_whoami');
    if (error) throw new Problem('Can\'t reach Marketing HQ', 'The database may be waking up after a quiet week. Try again in a minute.');
    if (!data) return screen('denied', { email });
    me = data;
    screen('loading', { text: 'Loading the dashboard' });
    await load();
    started = true;
    run();
  } catch (e) {
    screen('problem', e instanceof Problem ? e : { title: 'Something went wrong', text: e.message || String(e) });
  }
}

async function loadFonts() {
  await Promise.all(FONTS.map(async ([family, file, desc]) => {
    const { data, error } = await sb.storage.from(CFG.bucket).download('fonts/' + file);
    if (error || !data) return;
    const face = new FontFace(family, await data.arrayBuffer(), desc);
    await face.load();
    document.fonts.add(face);
  })).catch(() => { /* fall back to system fonts */ });
}

async function load() {
  const fonts = loadFonts();
  const { data, error } = await sb.from('hq_state').select('key,data,updated_at,updated_by');
  if (error) throw new Problem('Can\'t load Marketing HQ', error.message);
  rows = Object.fromEntries(data.map(r => [r.key, r]));
  if (me.view === 'private') {
    if (!rows.base || !rows.activity) throw new Problem('No data yet', 'Marketing HQ hasn\'t been loaded into Supabase yet. Ask Claude to run the build with --live.');
    SHARED.forEach(k => { if (rows['s:' + k]) { shared[k] = rows['s:' + k].data; lastSaved['s:' + k] = j(shared[k]); } });
    teamJSON = rows.team ? j(rows.team.data) : null;
  } else if (!rows.team) {
    throw new Problem('Almost ready', 'Marketing HQ is still being set up. Check back soon.');
  }
  await Promise.race([fonts, new Promise(r => setTimeout(r, 2500))]);
}

function run() {
  const team = rows.team && rows.team.data;
  window.HQ_MODE = me.view === 'private' ? 'owner' : 'team';
  window.HQ_DATA = me.view === 'private' ? rows.base.data : team.data;
  window.HQ_ACTIVITY = me.view === 'private' ? rows.activity.data : team.act;
  window.HQ_LIVE = LIVE;
  gate.hidden = true;
  gate.innerHTML = '';
  document.body.classList.remove('locked');
  const s = document.createElement('script');
  s.id = 'hq-app';
  s.textContent = document.getElementById('hq-app-src').textContent;
  document.body.append(s);
}

// ── Live data ───────────────────────────────────────────────────────────
async function saveShared(k) {
  delete timers[k];
  const key = 's:' + k;
  const data = shared[k] ?? (k === 'added' ? [] : {});
  lastSaved[key] = j(data);
  inflight++;
  const { error } = await sb.from('hq_state').upsert({ key, audience: 'private', data });
  inflight--;
  if (error) return app?.toast('Not saved: ' + error.message);
  rows[key] = { key, data, updated_at: new Date().toISOString(), updated_by: me.email };
}

async function publishTeam(payload, force) {
  if (!me || me.view !== 'private') return false;
  const s = j(payload);
  if (!force && s === teamJSON) return false;
  teamJSON = s;
  inflight++;
  const { error } = await sb.from('hq_state').upsert({ key: 'team', audience: 'team', data: payload });
  inflight--;
  if (error) { teamJSON = null; app?.toast('Team view not updated: ' + error.message); return false; }
  rows.team = { key: 'team', data: payload, updated_at: new Date().toISOString(), updated_by: me.email };
  return true;
}

// Apply one hq_state row that changed elsewhere (another person, another tab, or a build).
function apply(key, row) {
  if (row) rows[key] = row; else delete rows[key];
  const s = j(row ? row.data : null);
  if (me.view === 'private') {
    if (key.startsWith('s:')) {
      const k = key.slice(2);
      if (!SHARED.includes(k) || timers[k] || s === lastSaved[key]) return;
      lastSaved[key] = s;
      shared[k] = row ? row.data : undefined;
      app?.shared(k, clone(shared[k]));
    } else if ((key === 'base' || key === 'activity') && rows.base && rows.activity && s !== lastSaved[key]) {
      lastSaved[key] = s;
      app?.rebind(rows.base.data, rows.activity.data);
    } else if (key === 'team') {
      teamJSON = s;
    }
  } else if (key === 'team' && row && s !== lastSaved.team) {
    lastSaved.team = s;
    app?.rebind(row.data.data, row.data.act);
  }
  if (adm.open && adm.section === 'data') renderAdmin();
}

const refetchT = {};
function changed(key) {
  clearTimeout(refetchT[key]);
  refetchT[key] = setTimeout(async () => {
    const { data } = await sb.from('hq_state').select('key,data,updated_at,updated_by').eq('key', key).maybeSingle();
    apply(key, data || null);
  }, 250);
}

// Catch up after the laptop slept or the connection dropped, and notice if access was removed.
async function resync() {
  const { data: who } = await sb.rpc('hq_whoami');
  if (!who) { location.reload(); return; }
  if (who.view !== me.view || who.role !== me.role) { location.reload(); return; }
  const { data } = await sb.from('hq_state').select('key,data,updated_at,updated_by');
  if (!data) return;
  const seen = new Set(data.map(r => r.key));
  data.forEach(r => apply(r.key, r));
  Object.keys(rows).filter(k => !seen.has(k)).forEach(k => apply(k, null));
}

function subscribe() {
  if (me.view === 'private') lastSaved.base = j(rows.base.data), lastSaved.activity = j(rows.activity.data);
  else lastSaved.team = j(rows.team.data);
  sb.channel('hq-state')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'hq_state' }, p => {
      const key = (p.new && p.new.key) || (p.old && p.old.key);
      if (key) changed(key);
    })
    .subscribe();
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (Date.now() - hiddenAt > 60 * 1000) resync();
  });
}

sb.auth.onAuthStateChange(evt => {
  if (evt === 'SIGNED_OUT' && started) setTimeout(() => location.replace(location.pathname), 0);
});

window.addEventListener('beforeunload', e => {
  if (Object.keys(timers).length || inflight) { e.preventDefault(); e.returnValue = ''; }
});

async function signOut() {
  await Promise.all(Object.keys(timers).map(k => { clearTimeout(timers[k]); return saveShared(k); }));
  await sb.auth.signOut();
  location.replace(location.pathname);
}

const LIVE = {
  get me() { return me; },
  get(k, d) { return k in shared && shared[k] !== undefined ? clone(shared[k]) : d; },
  set(k, v) {
    shared[k] = clone(v);
    clearTimeout(timers[k]);
    timers[k] = setTimeout(() => saveShared(k), 450);
  },
  publishTeam,
  connect(hooks) { app = hooks; subscribe(); },
  openAdmin,
  signOut
};

// ── Admin layer: Settings ───────────────────────────────────────────────
const adm = { open: false, section: 'users', users: [], email: null, confirm: null, msg: null, back: null, el: null, scrim: null };

function buildAdmin() {
  adm.scrim = document.createElement('div');
  adm.scrim.className = 'adm-scrim';
  adm.el = document.createElement('section');
  adm.el.className = 'adm';
  adm.el.setAttribute('role', 'dialog');
  adm.el.setAttribute('aria-modal', 'true');
  adm.el.setAttribute('aria-labelledby', 'adm-title');
  adm.el.innerHTML = `
    <header class="adm-h">
      <h2 id="adm-title">Settings</h2>
      <nav class="seg" aria-label="Settings sections">
        <button type="button" data-adm-sec="users">Users</button><button type="button" data-adm-sec="email">Email</button><button type="button" data-adm-sec="data">Data</button>
      </nav>
      <button type="button" class="icon-btn" data-adm-close aria-label="Close settings">${app.ic('x')}</button>
    </header>
    <div class="adm-b" id="adm-body"></div>`;
  document.body.append(adm.scrim, adm.el);
  adm.scrim.addEventListener('click', closeAdmin);
  adm.el.addEventListener('click', adminClick);
  adm.el.addEventListener('change', adminChange);
  adm.el.addEventListener('submit', adminSubmit);
  adm.el.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); if (adm.confirm) { adm.confirm = null; renderAdmin(); } else closeAdmin(); }
    if (e.key === 'Tab') {                         // keep focus inside the panel
      const f = [...adm.el.querySelectorAll('button:not([disabled]), input, select, a[href]')].filter(n => n.offsetParent);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
}

function openAdmin(anchor) {
  if (!me || me.role !== 'admin') return;
  if (!adm.el) buildAdmin();
  adm.back = anchor || null;
  adm.open = true;
  adm.section = 'users';
  adm.confirm = null;
  adm.msg = null;
  adm.el.classList.add('open');
  adm.scrim.classList.add('on');
  renderAdmin();
  loadUsers();
  loadEmailStatus();
  setTimeout(() => { const i = adm.el.querySelector('#adm-email'); (i || adm.el.querySelector('[data-adm-close]')).focus(); }, 60);
}

function closeAdmin() {
  adm.open = false;
  adm.el.classList.remove('open');
  adm.scrim.classList.remove('on');
  if (adm.back && document.contains(adm.back)) adm.back.focus({ preventScroll: true });
}

async function loadUsers() {
  const { data, error } = await sb.from('hq_users').select('*').order('added_at', { ascending: true });
  if (error) { adm.msg = { kind: 'err', text: 'Could not load the user list: ' + error.message }; }
  else adm.users = data;
  if (adm.open) renderAdmin();
}

async function loadEmailStatus() {
  const r = await invoke('status');
  adm.email = r.ok ? r : { email_ready: false, error: r.error };
  if (adm.open && adm.section === 'email') renderAdmin();
}

function statusLine(u) {
  if (u.email === me.email && u.name) return { text: '' };
  if (u.last_seen_at) return { text: `Last opened ${day(u.last_seen_at)}` };
  if (u.invited_at) return { text: `Invited ${day(u.invited_at)}` };
  return { text: 'Invitation not sent', warn: true };
}

const opt = (v, label, cur) => `<option value="${v}"${v === cur ? ' selected' : ''}>${label}</option>`;

function userRow(u) {
  const st = statusLine(u);
  const self = u.email === me.email;
  const c = adm.confirm && adm.confirm.email === u.email ? adm.confirm : null;
  const initial = esc((u.name || u.email).charAt(0).toUpperCase());
  return `<li class="adm-u" data-email="${esc(u.email)}">
    <div class="who"><span class="avatar sm" aria-hidden="true">${initial}</span>
      <div class="who-t"><div class="em">${esc(u.name || u.email)}${self ? '<span class="you">You</span>' : ''}</div>
      ${u.name ? `<div class="sub-em">${esc(u.email)}</div>` : ''}${st.text ? `<div class="meta${st.warn ? ' warn' : ''}">${esc(st.text)}</div>` : ''}</div></div>
    <label class="pick"><span class="sr">Access level for ${esc(u.email)}</span>
      <select data-u-role>${opt('admin', 'Admin', u.role)}${opt('standard', 'Standard user', u.role)}</select></label>
    <label class="pick"><span class="sr">View for ${esc(u.email)}</span>
      <select data-u-view>${opt('private', 'Private view', u.view)}${opt('team', 'Team view', u.view)}</select></label>
    <div class="acts">${self ? '' : `<button type="button" class="btn sm" data-u-resend>${u.invited_at ? 'Resend' : 'Send invite'}</button>
      <button type="button" class="icon-btn sq" data-u-remove aria-label="Remove ${esc(u.email)}" title="Remove access">${app.ic('x')}</button>`}</div>
    ${c ? `<div class="adm-confirm" role="alertdialog" aria-label="Confirm"><p>${c.text}</p>
      <div class="row"><button type="button" class="btn primary sm" data-confirm-yes>${esc(c.yes)}</button><button type="button" class="btn sm" data-confirm-no>Cancel</button></div></div>` : ''}
  </li>`;
}

function renderUsers() {
  const list = adm.users;
  const m = adm.msg;
  return `
    <form class="adm-share" data-adm-share novalidate>
      <h3><label for="adm-email">Share Marketing HQ</label><span class="grow"></span></h3>
      <div class="adm-share-row">
        <input id="adm-email" type="email" autocomplete="off" placeholder="name@example.com" required>
        <button class="btn primary" type="submit">${app.ic('share')}Share</button>
      </div>
      <p class="adm-msg${m ? ' ' + m.kind : ''}" role="status" aria-live="polite">${m ? esc(m.text) : 'They get an email invitation and sign in with a one-time code. New people start as Standard user with Team view.'}</p>
    </form>
    <section>
      <h3>People with access <span class="count">${list.length}</span><span class="grow"></span></h3>
      <ul class="adm-users">${list.map(userRow).join('') || '<li class="adm-empty">Loading...</li>'}</ul>
    </section>
    <section>
      <h3>What each setting means<span class="grow"></span></h3>
      <dl class="adm-legend">
        <div><dt>Admin</dt><dd>Can open Settings to share Marketing HQ, remove people and change access.</dd></div>
        <div><dt>Standard user</dt><dd>Uses the dashboard but can't open Settings.</dd></div>
        <div><dt>Private view</dt><dd>Everything, including sources, quotes, private cards and Claude's queue. Can edit.</dd></div>
        <div><dt>Team view</dt><dd>Read-only. Shows only cards that are approved and marked Team.</dd></div>
      </dl>
    </section>`;
}

function renderEmail() {
  const e = adm.email;
  const ready = e && e.email_ready;
  return `
    <section>
      <h3>Invitations<span class="grow"></span></h3>
      <div class="adm-card">
        <div class="adm-status"><span class="dot${ready ? '' : ' off'}"></span>${!e ? 'Checking...' : ready
          ? `Ready. Invitations are sent from <b>${esc(e.sender)}</b>, with replies going to whoever clicked Share.`
          : 'Not set up yet. People you share with are added to the list, but no invitation email goes out.'}</div>
        ${ready ? `<div class="row"><button type="button" class="btn sm" data-adm-test>${app.ic('mail')}Send me a test invitation</button></div>` : ''}
      </div>
    </section>
    <section>
      <h3>Sign-in codes<span class="grow"></span></h3>
      <p class="adm-p">Supabase sends the one-time sign-in codes through the same Gmail account. If someone on the list doesn't get a code, check Supabase (Home 1), then Authentication, Emails, SMTP Settings.</p>
    </section>
    ${ready ? '' : `<section>
      <h3>Set up email (about 10 minutes, once)<span class="grow"></span></h3>
      <ol class="adm-steps">
        <li>In your Google Account, open Security. Make sure 2-Step Verification is on, then create an <b>app password</b> called "Marketing HQ".</li>
        <li>In Supabase (Home 1), open Edge Functions, then Secrets. Add <code>GMAIL_APP_PASSWORD</code> with that app password.</li>
        <li>In Supabase, open Authentication, then Emails, then SMTP Settings. Turn on custom SMTP: host <code>smtp.gmail.com</code>, port <code>465</code>, username and sender <code>${esc((e && e.sender) || 'your Gmail address')}</code>, sender name <code>Atlas Marketing HQ</code>, password: the same app password.</li>
        <li>In Supabase, open Authentication, then Emails, then the <b>Magic Link</b> template, and paste the code template from the Marketing HQ README.</li>
      </ol>
    </section>`}`;
}

function renderData() {
  const r = rows;
  const edits = SHARED.map(k => r['s:' + k]).filter(Boolean).sort((a, b) => b.updated_at.localeCompare(a.updated_at))[0];
  const line = (label, row, note) => `<li><span class="k">${label}<small>${note}</small></span><span class="v mono">${row ? `${when(row.updated_at)}<small>${esc(row.updated_by || '')}</small>` : '<small>Not yet</small>'}</span></li>`;
  return `
    <section>
      <h3>What's stored in Supabase<span class="grow"></span></h3>
      <ul class="adm-data">
        ${line('Content and dates', r.base, 'From the two Google Sheets. Updated when Claude runs the build.')}
        ${line('Activity, sources and the queue', r.activity, 'From the Gmail, Granola and Slack scans. Private view only.')}
        ${line('Edits', edits, 'Dates, decisions, TL;DRs, visibility and rules made in the dashboard.')}
        ${line('Team view', r.team, 'What Team view reads. Republished automatically after every change.')}
      </ul>
    </section>
    <div class="row">
      ${me.view === 'private' ? `<button type="button" class="btn sm" data-adm-republish>${app.ic('reset')}Republish Team view now</button>` : ''}
      <button type="button" class="btn sm" data-adm-export>${app.ic('download')}Export JSON</button>
    </div>`;
}

function renderAdmin() {
  if (!adm.el) return;
  adm.el.querySelectorAll('[data-adm-sec]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.admSec === adm.section)));
  const body = adm.el.querySelector('#adm-body');
  const active = document.activeElement;
  const typed = active && body.contains(active) && active.id === 'adm-email' ? active.value : null;
  body.innerHTML = adm.section === 'users' ? renderUsers() : adm.section === 'email' ? renderEmail() : renderData();
  const input = typed != null && body.querySelector('#adm-email');
  if (input) { input.value = typed; input.focus(); }
}

function say(kind, text) { adm.msg = { kind, text }; renderAdmin(); }

async function sendInvite(email) {
  const r = await invoke('invite', { email });
  if (r.ok) {
    const u = adm.users.find(x => x.email === email);
    if (u) u.invited_at = r.invited_at || new Date().toISOString();
    return { ok: true };
  }
  return r;
}

async function share(email) {
  email = email.trim().toLowerCase();
  if (!EMAIL.test(email)) return say('err', 'Enter a full email address.');
  if (adm.users.some(u => u.email === email)) return say('warn', `${email} already has access. Use Resend to send the invitation again.`);
  say('quiet', `Sharing with ${email}...`);
  const { error } = await sb.from('hq_users').insert({ email });
  if (error) return say('err', 'Could not add them: ' + error.message);
  await loadUsers();
  const r = await sendInvite(email);
  const input = adm.el.querySelector('#adm-email');
  if (input) input.value = '';
  if (r.ok) say('ok', `Shared with ${email}. Their invitation is on its way.`);
  else say('warn', `${email} is on the list, but the invitation wasn't sent: ${r.error || 'unknown error'}`);
  renderAdmin();
}

async function updateUser(email, patch, doneText) {
  const before = adm.users.find(u => u.email === email);
  const { error } = await sb.from('hq_users').update(patch).eq('email', email);
  if (error) { say('err', error.message.includes('at least one admin') ? 'Marketing HQ needs at least one admin. Make someone else an admin first.' : error.message); await loadUsers(); return false; }
  Object.assign(before, patch);
  if (email === me.email) { location.reload(); return true; }   // your own access changed: reopen with it
  adm.msg = { kind: 'ok', text: doneText };
  renderAdmin();
  return true;
}

async function removeUser(email) {
  const u = adm.users.find(x => x.email === email);
  const { error } = await sb.from('hq_users').delete().eq('email', email);
  if (error) return say('err', error.message.includes('at least one admin') ? 'Marketing HQ needs at least one admin.' : error.message);
  adm.users = adm.users.filter(x => x.email !== email);
  adm.msg = { kind: 'ok', text: `Removed ${email}. They can't open Marketing HQ any more.` };
  renderAdmin();
  app.toast(`Removed ${email}`, async () => {
    await sb.from('hq_users').insert({ email: u.email, name: u.name, role: u.role, view: u.view });
    loadUsers();
  });
}

function adminClick(e) {
  const t = e.target;
  let el;
  if (t.closest('[data-adm-close]')) return closeAdmin();
  if ((el = t.closest('[data-adm-sec]'))) { adm.section = el.dataset.admSec; adm.confirm = null; adm.msg = null; renderAdmin(); if (adm.section === 'email' && !adm.email) loadEmailStatus(); return; }
  const row = t.closest('.adm-u');
  const email = row && row.dataset.email;
  if (t.closest('[data-confirm-no]')) { adm.confirm = null; return loadUsers(); }
  if (t.closest('[data-confirm-yes]') && adm.confirm) { const c = adm.confirm; adm.confirm = null; return c.run(); }
  if (t.closest('[data-u-remove]')) {
    adm.confirm = { email, yes: 'Remove', text: `Remove <b>${esc(email)}</b>? They lose access straight away, even if they have Marketing HQ open.`, run: () => removeUser(email) };
    return renderAdmin();
  }
  if ((el = t.closest('[data-u-resend]'))) {
    el.disabled = true;
    el.textContent = 'Sending...';
    return sendInvite(email).then(r => {
      if (r.ok) say('ok', `Invitation sent to ${email}.`);
      else say('warn', `The invitation to ${email} wasn't sent: ${r.error || 'unknown error'}`);
    });
  }
  if ((el = t.closest('[data-adm-test]'))) {
    el.disabled = true;
    return invoke('test').then(r => { el.disabled = false; app.toast(r.ok ? `Test invitation sent to ${me.email}` : (r.error || 'The test email was not sent')); });
  }
  if (t.closest('[data-adm-republish]')) return app.publishTeamNow().then(ok => { app.toast(ok ? 'Team view republished' : 'Team view is already up to date'); renderAdmin(); });
  if (t.closest('[data-adm-export]')) return app.exportData();
}

function adminChange(e) {
  const t = e.target;
  const row = t.closest('.adm-u');
  if (!row) return;
  const email = row.dataset.email;
  const self = email === me.email;
  if (t.matches('[data-u-role]')) {
    const role = t.value;
    if (self && role !== 'admin') {
      adm.confirm = { email, yes: 'Make me a Standard user', text: 'You\'ll lose access to Settings, so only another admin can give it back.', run: () => updateUser(email, { role }) };
      return renderAdmin();
    }
    return updateUser(email, { role }, `${email} is now ${role === 'admin' ? 'an Admin' : 'a Standard user'}.`);
  }
  if (t.matches('[data-u-view]')) {
    const view = t.value;
    if (view === 'private' && !self) {
      adm.confirm = { email, yes: 'Give Private view', text: `Private view shows <b>${esc(email)}</b> everything you see, including sources, quotes, private cards and Claude's queue, and lets them edit.`, run: () => updateUser(email, { view }, `${email} now has Private view.`) };
      return renderAdmin();
    }
    if (view === 'team' && self) {
      adm.confirm = { email, yes: 'Switch me to Team view', text: 'You\'ll see the read-only Team view, without sources or the queue. You can switch back here.', run: () => updateUser(email, { view }) };
      return renderAdmin();
    }
    return updateUser(email, { view }, `${email} now has ${view === 'private' ? 'Private' : 'Team'} view.`);
  }
}

function adminSubmit(e) {
  if (!e.target.matches('[data-adm-share]')) return;
  e.preventDefault();
  share(e.target.querySelector('#adm-email').value);
}

start();

</script>
</body>
</html>
